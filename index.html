/* ---------- hover preview (desktop only) ---------- */
const peek = $('peek'), peekStage = $('peekStage'), peekInfo = $('peekInfo');
let peekTimer;

/* condensed camera settings for the popup: two short lines, blanks skipped */
function condensedGear(c, p) {
  const gear = c.gear || {};
  const pick = k => p[k] || gear[k] || '';
  const iso = pick('iso');
  const line1 = [pick('camera'), pick('lens')].filter(Boolean).join('  \u00b7  ');
  const line2 = [
    pick('focal'), pick('aperture'), pick('shutter'),
    iso ? (/^\d+$/.test(String(iso).trim()) ? 'ISO ' + iso : iso) : ''
  ].filter(Boolean).join('  \u00b7  ');
  let h = '';
  if (line1) h += `<div class="l1">${esc(line1)}</div>`;
  if (line2) h += `<div class="l2">${esc(line2)}</div>`;
  return h;
}

function showPeek(c, p, idx) {
  peekStage.innerHTML = p.src
    ? `<img src="${esc(p.src)}" alt="">`
    : `<div class="ph-big">${pad(idx + 1)}</div>`;
  peekInfo.innerHTML = condensedGear(c, p);
  peek.classList.add('on');
}
function hidePeek() { clearTimeout(peekTimer); peek.classList.remove('on'); }

/* ---------- index page: events table + search by tag ---------- */
const sx = { q: '', sel: [], mode: 'all' };
const sxInput = $('sxInput');

function sxMatch(e, sel, mode, tokens) {
  if (sel.length) {
    if (mode === 'any') { if (!sel.some(k => e.keys.includes(k))) return false; }
    else if (!sel.every(k => e.keys.includes(k))) return false;
  }
  return tokens.every(t => e.hay.includes(t));
}
function sxLoad(query) {
  const params = new URLSearchParams(query || '');
  sx.q = params.get('q') || '';
  sx.mode = params.get('mode') === 'any' ? 'any' : 'all';
  sx.sel = (params.get('tags') || '').split(',').map(t => t.trim().toLowerCase()).filter(k => k && TAG_TOTAL.has(k));
  sxInput.value = sx.q;
}
function sxSync() {                            // keep the address bar in step so a search can be shared
  const parts = [];
  if (sx.sel.length) parts.push('tags=' + sx.sel.map(encodeURIComponent).join(','));
  if (sx.q.trim()) parts.push('q=' + encodeURIComponent(sx.q.trim()));
  if (sx.mode === 'any' && sx.sel.length > 1) parts.push('mode=any');
  try { history.replaceState(null, '', '#index' + (parts.length ? '?' + parts.join('&') : '')); } catch (_) {}
}

function renderSearch() {
  const tokens = sx.q.toLowerCase().split(/\s+/).filter(Boolean);
  const filtering = sx.sel.length > 0 || tokens.length > 0;
  const results = filtering ? PHOTOS.filter(e => sxMatch(e, sx.sel, sx.mode, tokens)) : [];
  renderTotals(filtering ? results : PHOTOS, filtering);

  /* tag chips. In "All" mode each count is how many photos you would have if you added that tag,
     and tags that would leave nothing are dimmed, so you can't search yourself into a dead end. */
  const tagsBox = $('sxTags');
  if (!TAG_ORDER.length) {
    tagsBox.innerHTML = '<p class="sx-note">No tags yet. Add <code>tags: ["sports", "nature"]</code> to a photo or an event in events.js and they will show up here. You can already search by event name, place or notes above.</p>';
    $('sxTools').hidden = true;
  } else {
    $('sxTools').hidden = false;
    tagsBox.innerHTML = TAG_ORDER.map(k => {
      const selected = sx.sel.includes(k);
      const n = sx.mode === 'any'
        ? PHOTOS.filter(e => e.keys.includes(k) && tokens.every(t => e.hay.includes(t))).length
        : PHOTOS.filter(e => sxMatch(e, selected ? sx.sel : sx.sel.concat(k), 'all', tokens)).length;
      const zero = !selected && n === 0;
      return `<button type="button" class="sx-chip${zero ? ' zero' : ''}" data-k="${esc(k)}" aria-pressed="${selected}"` +
             `${zero ? ' aria-disabled="true"' : ''}>${esc(TAG_LABEL.get(k))}<span>${n}</span></button>`;
    }).join('');
  }
  $('sxModeAll').setAttribute('aria-pressed', sx.mode === 'all');
  $('sxModeAny').setAttribute('aria-pressed', sx.mode === 'any');
  $('sxClear').hidden = !filtering;

  $('sxStatus').textContent = filtering
    ? `${results.length} of ${PHOTOS.length} photo${PHOTOS.length === 1 ? '' : 's'}`
    : `${PHOTOS.length} photo${PHOTOS.length === 1 ? '' : 's'} · ${TAG_ORDER.length} tag${TAG_ORDER.length === 1 ? '' : 's'}`;

  /* results replace the events table while you are searching */
  const box = $('sxResults');
  box.innerHTML = '';
  box.hidden = !filtering;
  $('indexList').hidden = filtering;
  if (!filtering) return;
  if (!results.length) {
    box.innerHTML = '<p class="sx-note">No photos match. Try removing a tag, or switch Match to &ldquo;Any&rdquo;.</p>';
    return;
  }
  results.forEach((e, i) => {
    const item = document.createElement('div');
    item.className = 'res-item';
    const b = document.createElement('button');
    b.className = 'tile';
    b.setAttribute('aria-label', `View photo ${e.idx + 1} of ${e.c.title}`);
    b.innerHTML = e.p.src
      ? `<img src="${esc(e.p.src)}" alt="${esc(e.p.caption || e.c.title + ' photo ' + (e.idx + 1))}" loading="lazy">`
      : `<span class="ph">${pad(e.idx + 1)}</span>`;
    b.addEventListener('click', () => openLb(i, results));
    attachPeek(b, e.c, e.p, e.idx);
    const cap = document.createElement('div');
    cap.className = 'res-cap';
    const labels = e.keys.slice(0, 4).map(k => TAG_LABEL.get(k)).join(' · ');
    cap.innerHTML = esc(e.c.title) + (labels ? `<span>${esc(labels)}</span>` : '');
    item.appendChild(b);
    item.appendChild(cap);
    box.appendChild(item);
  });
}

function renderIndex() {
  const n = COLLECTIONS.length;
  $('indexMeta').textContent = n + (n === 1 ? ' event' : ' events');
  let h = `<div class="ix-row ix-head"><span>Event</span><span>Date</span><span>Location</span><span>Photos</span></div>`;
  BY_DATE.forEach(c => {
    h += `<a class="ix-row" href="#${esc(c.id)}">` +
           `<span>${esc(c.title)}</span><span>${esc(c.date || '')}</span>` +
           `<span>${esc(c.location || '')}</span><span>${c.photos.length}</span>` +
         `</a>`;
  });
  $('indexList').innerHTML = h;
  renderSearch();
}
/* the four big numbers follow the search: with tags selected they count only what matches */
let ixLast = '';
function renderTotals(list, filtering) {
  const evs = new Set(), places = new Set(), tags = new Set();
  list.forEach(e => {
    evs.add(e.c.id);
    const pl = (e.c.location || '').trim().toLowerCase(); if (pl) places.add(pl);
    e.keys.forEach(k => tags.add(k));
  });
  const vals = [evs.size, list.length, places.size, tags.size];
  const labs = [['Event', 'Events'], ['Photo', 'Photos'], ['Place', 'Places'], ['Tag', 'Tags']];
  const sig = vals.join(',') + (filtering ? 'f' : '');
  if (sig === ixLast) return;
  const prev = ixLast.split(',').map(Number); ixLast = sig;
  const box = $('ixTotals');
  box.classList.toggle('filtered', filtering);
  box.innerHTML = vals.map((v, i) => `<div class="ix-stat${prev[i] !== v ? ' bump' : ''}"><b>${v}</b><span>${labs[i][v === 1 ? 0 : 1]}</span></div>`).join('');
}

sxInput.addEventListener('input', () => { sx.q = sxInput.value; sxSync(); renderSearch(); });
sxInput.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sxInput.value) { sxInput.value = ''; sx.q = ''; sxSync(); renderSearch(); }
});
$('sxTags').addEventListener('click', e => {
  const b = e.target.closest('.sx-chip');
  if (!b || b.classList.contains('zero')) return;
  const k = b.dataset.k, i = sx.sel.indexOf(k);
  if (i >= 0) sx.sel.splice(i, 1); else sx.sel.push(k);
  sxSync(); renderSearch();
  const again = [...$('sxTags').querySelectorAll('.sx-chip')].find(x => x.dataset.k === k);
  if (again) again.focus({ preventScroll: true });
});
$('sxModeAll').addEventListener('click', () => { sx.mode = 'all'; sxSync(); renderSearch(); });
$('sxModeAny').addEventListener('click', () => { sx.mode = 'any'; sxSync(); renderSearch(); });
$('sxClear').addEventListener('click', () => {
  sx.q = ''; sx.sel = []; sx.mode = 'all'; sxInput.value = '';
  sxSync(); renderSearch(); sxInput.focus();
});

/* open the Index page already filtered by a tag (used by tag chips elsewhere) */
function goToTag(k) {
  const h = '#index?tags=' + encodeURIComponent(k);
  if (location.hash === h) route(); else location.hash = h;
}

/* ---------- hover preview on a photo tile (desktop only) ---------- */
function attachPeek(b, c, p, idx) {
  if (!canHover) return;
  let ax = 0, ay = 0;                                     // where the cursor started resting
  const arm = () => {
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => showPeek(c, p, idx), CFG.peekDelay);
  };
  b.addEventListener('mouseenter', e => { ax = e.clientX; ay = e.clientY; arm(); });
  b.addEventListener('mousemove', e => {
    if (peek.classList.contains('on')) return;            // already enlarged
    if (Math.hypot(e.clientX - ax, e.clientY - ay) > 12) {   // cursor moved: start the wait over
      ax = e.clientX; ay = e.clientY; arm();
    }
  });
  b.addEventListener('mouseleave', hidePeek);
}

/* ---------- collection page ---------- */
/* the tags under an event title: a slow drifting line; the arrow opens the whole list */
const tagBar = $('tagBar'), tagArrow = $('tagArrow'), tagTrack = $('collTags');
function setTagsOpen(open) {
  tagBar.classList.toggle('open', open);
  tagArrow.setAttribute('aria-expanded', String(open));
  tagArrow.setAttribute('aria-label', open ? 'Show fewer tags' : 'Show all tags');
}
function setupTagBar(c) {
  const keys = c._tagKeys || [];
  tagBar.classList.toggle('none', !keys.length);
  tagBar.classList.remove('still');
  setTagsOpen(false);
  const set = hidden => `<div class="tg-set"${hidden ? ' aria-hidden="true"' : ''}>` + keys.map(k =>
    `<a class="ch-tag" href="#index?tags=${encodeURIComponent(k)}"${hidden ? ' tabindex="-1"' : ''}>${esc(TAG_LABEL.get(k))}</a>`).join('') + '</div>';
  tagTrack.innerHTML = set(false) + set(true);
  tagTrack.style.setProperty('--tg-dur', Math.max(25, keys.length * 2.6) + 's');
  requestAnimationFrame(() => {                       // few tags that already fit: no need to drift or to open
    const fits = tagTrack.firstElementChild.scrollWidth <= tagTrack.parentElement.clientWidth;
    tagBar.classList.toggle('still', fits || reduceMotion);
    tagArrow.style.display = fits ? 'none' : '';
  });
}
tagArrow.addEventListener('click', () => setTagsOpen(!tagBar.classList.contains('open')));

function renderCollection(c) {
  currentColl = c;
  const ordered = c.photos.map((p, idx) => ({ c, p, idx })).sort((a, b) => viewsOf(b.p) - viewsOf(a.p) || a.idx - b.idx);   // most viewed first
  lbList = ordered;
  hidePeek();
  chalkTitle($('collTitle'), c.title);
  $('collMeta').textContent = [c.date, c.location, c.photos.length + (c.photos.length === 1 ? ' photo' : ' photos')]
    .filter(Boolean).join('  ·  ');
  $('collScore').textContent = c.score || '';
  $('collDesc').textContent = c.description || '';
  $('collDesc').style.display = c.description ? '' : 'none';
  setupTagBar(c);

  const layout = ['grid', 'square', 'wide', 'masonry'].includes(c.layout) ? c.layout : 'grid';
  grid.className = 'grid layout-' + layout;
  grid.innerHTML = '';

  const cols = layout === 'masonry' ? (window.innerWidth <= 734 ? 2 : 3) : 0;
  const colEls = [];
  for (let k = 0; k < cols; k++) { const d = document.createElement('div'); d.className = 'mcol'; grid.appendChild(d); colEls.push(d); }
  ordered.forEach((e, pos) => {                                      // placed left to right, then the next row down
    const p = e.p, idx = e.idx;
    const b = document.createElement('button');
    b.className = 'tile' + (layout === 'masonry' && !p.src ? ' r' + (idx % 4) : '');
    b.setAttribute('aria-label', `View photo ${pos + 1} of ${c.title}`);
    b.innerHTML = p.src
      ? `<img src="${esc(p.src)}" alt="${esc(p.caption || c.title + ' photo ' + (idx + 1))}" loading="lazy">`
      : `<span class="ph">${pad(idx + 1)}</span>`;
    b.addEventListener('click', () => openLb(pos));
    attachPeek(b, c, p, idx);
    (cols ? colEls[pos % cols] : grid).appendChild(b);
  });
}

/* ---------- chalk title ---------- */
function chalkTitle(el, text) {
  el.classList.remove('go'); el.classList.add('chalk');
  el.setAttribute('aria-label', text);
  el.innerHTML = '';
  let n = 0;
  String(text).split(/(\s+)/).forEach(word => {
    if (!word) return;
    const w = document.createElement('span'); w.className = 'cw'; w.setAttribute('aria-hidden', 'true');
    if (/^\s+$/.test(word)) { w.textContent = ' '; el.appendChild(w); n++; return; }
    [...word].forEach(ch => {
      const l = document.createElement('span'); l.className = 'cl'; l.textContent = ch;
      l.style.setProperty('--d', (0.25 + n * 0.055).toFixed(3) + 's');                 // letters are written one after another
      l.style.setProperty('--w', (-Math.random() * 0.8).toFixed(2) + 's');             // each wiggles out of step with the others
      l.style.setProperty('--r', (Math.random() * 3 - 1.5).toFixed(1) + 'deg');        // and sits a little crooked, like handwriting
      w.appendChild(l); n++;
    });
    el.appendChild(w);
  });
  void el.offsetWidth; el.classList.add('go');
}

/* ---------- routing ---------- */
function route() {
  const raw = (location.hash || '').replace('#', '');
  const qi = raw.indexOf('?');                              // e.g.  index?tags=sports,nature
  const name = qi < 0 ? raw : raw.slice(0, qi);
  let target = name || 'home';
  const coll = COLLECTIONS.find(c => c.id === target);

  hidePeek();
  closePop();
  if (target === 'about') showView('about');
  else if (target === 'favorites') { showView('favorites'); if (window.magReset) window.magReset(); }
  else if (target === 'contact') showView('contact');
  else if (target === 'globe' || target === 'map') { showView('globe'); openGlobe(); }
  else if (target === 'index') { sxLoad(qi < 0 ? '' : raw.slice(qi + 1)); renderIndex(); showView('index'); }
  else if (coll) { renderCollection(coll); showView('collection'); }
  else {
    target = 'home';
    showView('home');
    buildMarquee();
  }

  document.querySelectorAll('#nav [data-route], #homeNav [data-route]').forEach(a => {
    a.classList.toggle('active', a.dataset.route === target);
  });
  document.querySelectorAll('#homeNav .hn-sec.open').forEach(x => x.classList.remove('open'));
  nav.classList.remove('open');
  $('menuToggle').setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}

/* ---------- fullscreen viewer + info window ---------- */
const lb = $('lb'), lbStage = $('lbStage'), lbCount = $('lbCount'), lbInfo = $('lbInfo');
let infoOpen = window.innerWidth > 900;     // starts open on computers, closed on phones

function infoRow(label, value) {
  return `<div class="i-row"><span>${esc(label)}</span><span>${esc(value)}</span></div>`;
}
function infoHTML(c, p) {
  const gear = c.gear || {};
  const pick = k => p[k] || gear[k] || '';
  let h = `<div class="i-sec"><div class="i-title">${esc(c.title)}</div>`;
  const date = p.date || c.date, loc = p.location || c.location;
  if (date) h += infoRow('Date', date);
  if (loc) h += infoRow('Location', loc);
  if (VIEWS_API) h += infoRow('Views', String(viewsOf(p)));
  h += `</div>`;

  const cam = [
    ['Camera', 'camera'], ['Lens', 'lens'], ['Focal length', 'focal'],
    ['Aperture', 'aperture'], ['Shutter', 'shutter'], ['ISO', 'iso']
  ].map(([label, key]) => [label, pick(key)]).filter(r => r[1]);
  if (cam.length) {
    h += `<div class="i-sec"><div class="i-head">Camera</div>${cam.map(r => infoRow(r[0], r[1])).join('')}</div>`;
  }
  const tags = p._tags || [];
  if (tags.length) {
    h += `<div class="i-sec"><div class="i-head">Tags</div><div class="i-tags">` +
         tags.map(k => `<a class="i-tag" href="#index?tags=${encodeURIComponent(k)}" data-tag="${esc(k)}">${esc(TAG_LABEL.get(k))}</a>`).join('') +
         `</div></div>`;
  }
  return h;
}

function drawLb() {
  const e = lbList[lbIndex];
  if (!e) return;
  lbStage.innerHTML = e.p.src
    ? `<img src="${esc(e.p.src)}" alt="${esc(e.p.caption || e.c.title)}">`
    : `<div class="ph-big">${pad(e.idx + 1)}</div>`;
  lbCount.textContent = `${lbIndex + 1} / ${lbList.length}`;
  lbInfo.innerHTML = infoHTML(e.c, e.p);
}
function setInfo(open) {
  infoOpen = open;
  lb.classList.toggle('info-on', open);
  $('lbInfoBtn').setAttribute('aria-pressed', open);
}
function openLb(i, list) {
  if (list) lbList = list;
  if (lbList[i]) countView(lbList[i].p);
  if (!lbList.length) return;
  hidePeek();
  lbIndex = i;
  setInfo(infoOpen);
  drawLb();
  lb.classList.add('on');
  lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  lb.classList.remove('on');
  lb.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
function stepLb(d) {
  const n = lbList.length;
  if (!n) return;
  lbIndex = (lbIndex + d + n) % n;
  countView(lbList[lbIndex] && lbList[lbIndex].p);
  drawLb();
}

$('lbClose').addEventListener('click', closeLb);
$('lbPrev').addEventListener('click', () => stepLb(-1));
$('lbNext').addEventListener('click', () => stepLb(1));
$('lbInfoBtn').addEventListener('click', () => setInfo(!infoOpen));
$('lbMain').addEventListener('click', e => { if (e.target === $('lbMain') || e.target === lbStage) closeLb(); });
lbInfo.addEventListener('click', e => {                       // a tag in the info window searches for it
  const a = e.target.closest('a[data-tag]');
  if (!a) return;
  e.preventDefault();
  closeLb();
  goToTag(a.dataset.tag);
});
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') stepLb(-1);
  if (e.key === 'ArrowRight') stepLb(1);
  if (e.key === 'i' || e.key === 'I') setInfo(!infoOpen);
});
let swipeX = null;                                   // swipe left/right on a phone
lbStage.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, { passive: true });
lbStage.addEventListener('touchend', e => {
  if (swipeX === null) return;
  const dx = e.changedTouches[0].clientX - swipeX;
  swipeX = null;
  if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- mobile menu ---------- */
$('menuToggle').addEventListener('click', e => {
  const open = nav.classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', open);
});

/* ---------- start ---------- */
$('yr').textContent = new Date().getFullYear();
buildNav();
measureSidebar();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureSidebar);
window.addEventListener('hashchange', route);
route();
requestAnimationFrame(frame);

/* ---------- paper texture + living dot grid ----------
   Two layers. The paper itself (soft blotches, grain, fibres) is drawn once
   into a tiled image. The dotted graph-paper grid is a live canvas behind the
   page: every dot is nudged, sized and weighted a little differently, a few
   of them slowly twinkle, and any dots near the cursor dim at once, then
   fade back in once the cursor has moved on. */
(function paperTexture() {
  const ink = (getComputedStyle(document.documentElement).getPropertyValue('--rgb-ink').trim() || '241,239,234');
  let seed = 20261109;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  /* 1. the paper */
  try {
    const S = 960, dpr = Math.min(2, window.devicePixelRatio || 1);
    const cv = document.createElement('canvas');
    cv.width = cv.height = S * dpr;
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    for (let i = 0; i < 26; i++) {
      const x = rnd() * S, y = rnd() * S, r = 60 + rnd() * 170;
      const dark = rnd() < 0.55;
      const gr = c.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, dark ? 'rgba(0,0,0,0.10)' : 'rgba(' + ink + ',0.028)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = gr;
      for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { c.save(); c.translate(ox, oy); c.fillRect(x - r, y - r, r * 2, r * 2); c.restore(); }
    }
    for (let i = 0; i < 2600; i++) {
      const x = rnd() * S, y = rnd() * S;
      c.fillStyle = rnd() < 0.5 ? 'rgba(' + ink + ',' + (0.03 + rnd() * 0.06).toFixed(3) + ')' : 'rgba(0,0,0,' + (0.05 + rnd() * 0.10).toFixed(3) + ')';
      const r = 0.3 + rnd() * 0.6; c.fillRect(x, y, r, r);
    }
    for (let i = 0; i < 14; i++) {

/* ---------- photo protection ----------

        cx.shadowColor = 'rgba(0,0,0,0.6)'; cx.shadowBlur = mw * 0.03; cx.fillStyle = '#fff';
        cx.fillText(SITE.name || 'Allwood Archives', 0, 0);

    get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} }
  };
  let want = store.get('aa-music') === '1';
  let level = store.get('aa-vol'); level = level === null ? 0.4 : clamp(parseFloat(level) || 0, 0, 1);
  vol.value = Math.round(level * 100);
  let engine = null, playing = false;

  /* --- a generated ambient pad: slow chords, a soft filter that breathes, and the odd bell --- */
  function makeAmbient() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ctx = new AC();
    const master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    // a made-up "room": decaying noise, used as reverb
    const len = ctx.sampleRate * 4, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const verb = ctx.createConvolver(); verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.55;
    verb.connect(wet); wet.connect(master);
    const dry = ctx.createGain(); dry.gain.value = 0.7; dry.connect(master);
    const bus = ctx.createGain(); bus.connect(dry); bus.connect(verb);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.4;
    lp.connect(bus);
    const lfo = ctx.createOscillator(), lfoAmt = ctx.createGain();
    lfo.frequency.value = 0.06; lfoAmt.gain.value = 450; lfo.connect(lfoAmt); lfoAmt.connect(lp.frequency); lfo.start();

    const chords = [
      [130.81, 164.81, 196.00, 246.94, 293.66],      // C maj 9
      [110.00, 130.81, 164.81, 196.00, 246.94],      // A min 9
      [87.31, 130.81, 174.61, 220.00, 261.63],       // F maj 7
      [98.00, 146.83, 196.00, 220.00, 246.94]        // G 6/9
    ];
    const bells = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    let step = 0, timers = [], live = [], stopped = false;

    function chord() {
      if (stopped) return;
      const t = ctx.currentTime, hold = 16, g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16, t + 5); g.gain.setValueAtTime(0.16, t + hold - 3); g.gain.linearRampToValueAtTime(0, t + hold + 4);
      g.connect(lp);
      chords[step % chords.length].forEach(f => {
        [['triangle', -5], ['sine', 6]].forEach(([type, cents]) => {
          const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = cents;
          o.connect(g); o.start(t); o.stop(t + hold + 4.2); live.push(o);
        });
      });
      step++;
      timers.push(setTimeout(chord, hold * 1000));
    }
    function bell() {
      if (stopped) return;
      const t = ctx.currentTime, f = bells[Math.floor(Math.random() * bells.length)];
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.03, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 5);
      g.connect(verb); g.connect(bus);
      [[1, 1], [2.01, 0.25]].forEach(([m, a]) => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
        const og = ctx.createGain(); og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + 5.2); live.push(o);
      });
      timers.push(setTimeout(bell, 4000 + Math.random() * 6000));
    }
    return {
      start(v) {
        if (ctx.state === 'suspended') ctx.resume();
        stopped = false; chord(); timers.push(setTimeout(bell, 3500));
        master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(v * 0.5, ctx.currentTime, 1.2);
      },
      volume(v) { master.gain.setTargetAtTime(v * 0.5, ctx.currentTime, 0.15); },
      stop() {
        stopped = true; timers.forEach(clearTimeout); timers = [];
        master.gain.setTargetAtTime(0, ctx.currentTime, 0.5);
        setTimeout(() => { live.forEach(o => { try { o.stop(); } catch (_) {} }); live = []; ctx.suspend(); }, 2200);
      },
      pause(on) { if (on) ctx.suspend(); else if (!stopped) ctx.resume(); }
    };
  }

  /* --- or your own audio file --- */
  function makeFile(src) {
    const a = new Audio(Array.isArray(src) ? src[0] : src);
    a.loop = true; a.preload = 'none'; a.volume = 0;
    let fade = 0;
    const ramp = to => { clearInterval(fade); fade = setInterval(() => {
      const d = to - a.volume; if (Math.abs(d) < 0.02) { a.volume = clamp(to, 0, 1); clearInterval(fade); if (to === 0) a.pause(); } else a.volume = clamp(a.volume + d * 0.2, 0, 1);
    }, 60); };
    return {
      start(v) { const p = a.play(); if (p && p.catch) p.catch(() => {}); ramp(v); },
      volume(v) { a.volume = clamp(v, 0, 1); },
      stop() { ramp(0); },
      pause(on) { if (on) a.pause(); else if (playing) a.play().catch(() => {}); }
    };
  }

  function paint() {
    box.classList.toggle('on', want);
    box.classList.toggle('playing', playing);
    btn.setAttribute('aria-pressed', String(want));
    btn.setAttribute('aria-label', want ? 'Pause background music' : 'Play background music');
    label.textContent = want ? 'Music on' : 'Music off';
  }
  function begin() {
    if (!engine) engine = CFG.music ? makeFile(CFG.music) : makeAmbient();
    if (!engine) { want = false; paint(); return; }
    engine.start(level); playing = true; paint();
  }
  function end() { if (engine) engine.stop(); playing = false; paint(); }

  btn.addEventListener('click', () => {
    if (want && !playing) { begin(); return; }       // it was left on last time: this click just gets it going
    want = !want; store.set('aa-music', want ? '1' : '0');
    if (want) begin(); else end();
  });
  vol.addEventListener('input', () => { level = vol.value / 100; store.set('aa-vol', String(level)); if (engine && playing) engine.volume(level); });
  if (want) {                                         // remembered "on": start at the first click or key press
    const kick = e => {
      if (e.target && e.target.closest && e.target.closest('#music')) return;
      document.removeEventListener('pointerdown', kick, true); document.removeEventListener('keydown', kick, true);
      if (want && !playing) begin();
    };
    document.addEventListener('pointerdown', kick, true); document.addEventListener('keydown', kick, true);
  }
  document.addEventListener('visibilitychange', () => { if (engine && playing) engine.pause(document.hidden); });
  paint();
})();
</script>
</body>
</html>
