<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allwood Archives</title>
<meta name="description" content="A portfolio of selected work.">
<!-- Inter: a free typeface that closely matches the look of NB International, the font A24 uses -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<!--
  index.html is the CODE of the site. Your content (events, photos, About,
  Contact) lives in events.js, so you can replace this file with a newer
  version at any time without losing anything you typed.
-->
<style>
  :root {
    --bg: #d9d9d7;        /* background. Darker: #d3d3d1   Lighter: #dfdfdd */
    --ink: #262626;       /* main text: a soft dark, not pure black */
    --muted: #5c5c5a;     /* menu + small text */
    --tile: #c8c8c6;      /* boxes behind photos / placeholders */
    --ph: #7a7a78;        /* text on placeholder boxes */
    --line: #c6c6c4;
    --panel: #e3e3e1;     /* info window, popups, globe land */
    --sidebar: 250px;
    /* typeface. NB International is A24's font (paid). If you own it and upload the font
       files, it is used automatically; otherwise Inter (free) is used. */
    --font: "NB International", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --logo-width: 150px;  /* set from SETTINGS.logoWidth in events.js */
    --m-h: clamp(190px, 54vh, 620px);   /* height of the photos in the Home marquee */
    --m-gap: 18px;                      /* space between marquee photos */
    --gap: 10px;                        /* space between photos in a collection */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- sidebar ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--sidebar);
    padding: 36px 28px;
    overflow-x: hidden; overflow-y: auto;
    background: var(--bg);
    z-index: 20;
    transition: width 0.28s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.28s ease;
  }
  /* blur layer that covers the page (but not the sidebar) while the sidebar is open */
  .scrim {
    position: fixed; inset: 0; z-index: 19;
    background: rgba(217, 217, 215, 0.3);
    -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease;
  }
  /* On a computer the sidebar rests narrow and shows only the section headings.
     Hover it (or tab into it) and it widens, the sub-links drop down, and the page
     behind it blurs slightly. */
  @media (hover: hover) and (min-width: 721px) {
    :root { --sidebar: 160px; }
    .sidebar:not(.closed):hover,
    .sidebar:not(.closed):focus-within {
      width: min(var(--sidebar-open, 250px), 70vw);
      box-shadow: 8px 0 28px rgba(0, 0, 0, 0.07);
    }
    .sidebar:not(.closed):hover ~ .scrim,
    .sidebar:not(.closed):focus-within ~ .scrim { opacity: 1; }
  }
  .logo {
    display: block;
    font-size: 20px; line-height: 1.1; letter-spacing: 0.02em;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 44px;
  }
  .logo:hover { color: var(--ink); }
  .logo img { display: block; width: var(--logo-width); max-width: 100%; height: auto; }
  /* a gentle side-to-side turn so the logo has a little life (SETTINGS.logoSway in events.js; 0 = off) */
  .logo { perspective: 600px; }
  .logo img, .logo .logo-text {
    transform-origin: 50% 50%;
    animation: logo-sway 7s ease-in-out infinite;
    will-change: transform;
  }
  .logo .logo-text { transform-origin: 0 50%; }
  @keyframes logo-sway {
    0%, 100% { transform: rotateY(calc(var(--sway, 14deg) * -1)); }
    50%      { transform: rotateY(var(--sway, 14deg)); }
  }

  .nav { list-style: none; margin: 0; padding: 0; }
  .nav li { margin: 0 0 9px; white-space: nowrap; }
  .nav a {
    display: inline-block; vertical-align: top;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;   /* one straight line, never wraps */
    line-height: 1.4;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    transform-origin: left center;
    transition: color 0.15s, transform 0.15s ease;
  }
  .nav a:hover, .nav a.active { color: var(--ink); }
  @media (hover: hover) { .nav a:hover { transform: scale(1.08); } }   /* slight magnify on hover */

  /* section headers: Home, Projects, Info */
  .nav .sec { margin: 0 0 22px; }
  .nav .head {
    display: block;
    font-size: 15px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    outline: none;
  }
  .nav .head a { color: var(--ink); }
  .nav .head:focus-visible { text-decoration: underline; text-underline-offset: 4px; }

  /* the sub-links under each header */
  .nav .subs { display: grid; grid-template-rows: 1fr; }
  .nav .subs > ul { list-style: none; margin: 0; padding: 12px 0 0; min-height: 0; overflow: hidden; }
  .nav .subs li:last-child { margin-bottom: 0; }
  @media (hover: hover) and (min-width: 721px) {
    /* closed: only the headers show */
    .nav .subs {
      grid-template-rows: 0fr; opacity: 0; visibility: hidden;
      transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.7, 0.2, 1),
                  opacity 0.2s ease, visibility 0s linear 0.3s;
    }
    /* open: they drop down */
    .sidebar:not(.closed):hover .subs,
    .sidebar:not(.closed):focus-within .subs {
      grid-template-rows: 1fr; opacity: 1; visibility: visible;
      transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) 0.06s,
                  opacity 0.25s ease 0.1s, visibility 0s;
    }
  }

  .menu-toggle { display: none; }

  /* ---------- main ---------- */
  main {
    margin-left: var(--sidebar);
    min-height: 100vh;
    padding: 36px 0 0 8px;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .view { display: none; flex: 1; padding-right: 36px; }
  .view.on { display: block; }
  #view-home { padding-right: 0; }
  #view-home.on { display: flex; align-items: center; }

  /* ---------- home marquee (drag it, or let it drift) ---------- */
  .marquee {
    width: 100%;
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;          /* sideways = drag the row, up/down = scroll the page */
    user-select: none; -webkit-user-select: none;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
  }
  .marquee.dragging { cursor: grabbing; }
  .marquee.dragging a { pointer-events: none; }
  .track {
    display: flex;
    width: max-content;
    will-change: transform;
  }
  .group { display: flex; flex-shrink: 0; }
  .m-item {
    display: block;
    flex-shrink: 0;
    margin-right: var(--m-gap);
    width: calc(var(--m-h) * 16 / 9);
    text-decoration: none;
  }
  .m-img {
    position: relative;
    display: block;
    width: 100%;
    height: var(--m-h);
    background: var(--tile);
    overflow: hidden;
  }
  .m-img img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
  .m-img .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em; font-size: 12px; text-transform: uppercase;
  }
  .m-cap {
    display: flex; gap: 10px;
    margin-top: 12px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px;
    color: var(--ink);
  }
  .m-cap span { color: var(--muted); }
  .m-item:hover .m-cap span { color: var(--ink); }

  /* ---------- page headings (collection + globe) ---------- */
  .collection-head { margin: 0 0 26px; }
  .ch-title {
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px;
  }
  .ch-meta {
    margin-top: 6px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
  }
  .ch-desc {
    max-width: 560px;
    margin: 16px 0 0;
    font-size: 14px; line-height: 1.6;
    color: var(--ink);
  }

  /* photo layouts. Pick one per collection with  layout: "grid" | "square" | "wide" | "masonry"  */
  .grid {
    display: grid;
    gap: var(--gap);
    grid-template-columns: repeat(var(--cols, 3), 1fr);
  }
  .layout-grid   { --cols: 3; --ratio: 3 / 2; }   /* 3 across, every photo cropped to the same shape */
  .layout-square { --cols: 4; --ratio: 1 / 1; }   /* 4 across, square tiles */
  .layout-wide   { --cols: 2; --ratio: 16 / 9; }  /* 2 across, big cinematic tiles */
  .layout-masonry {                               /* 3 columns, photos keep their own shape (no cropping) */
    display: block;
    column-count: 3;
    column-gap: var(--gap);
  }
  .layout-masonry .tile { margin-bottom: var(--gap); break-inside: avoid; }
  .layout-masonry .tile img { height: auto; }
  .layout-masonry .tile.r0 { aspect-ratio: 3 / 2; }
  .layout-masonry .tile.r1 { aspect-ratio: 2 / 3; }
  .layout-masonry .tile.r2 { aspect-ratio: 1 / 1; }
  .layout-masonry .tile.r3 { aspect-ratio: 4 / 5; }

  .tile {
    position: relative;
    display: block; width: 100%;
    aspect-ratio: var(--ratio, auto);
    background: var(--tile);
    overflow: hidden;
    cursor: zoom-in;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em; font-size: 12px;
  }

  /* ---------- globe ---------- */
  .globe-area { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .globe-wrap {
    position: relative;
    border-radius: 50%;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.10);
    touch-action: none;
    cursor: grab;
    user-select: none; -webkit-user-select: none;
  }
  .globe-wrap.dragging { cursor: grabbing; }
  .globe-wrap canvas { display: block; }
  .pins { position: absolute; inset: 0; pointer-events: none; }
  .pin {
    position: absolute; left: 0; top: 0;
    width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(38, 38, 38, 0.3);
    display: flex; align-items: center; justify-content: center;
    color: var(--bg); font-size: 9px; font-weight: 700; line-height: 1;
    opacity: 0; pointer-events: none;
    cursor: pointer;
    transition: opacity 0.2s ease, box-shadow 0.15s ease;
  }
  .pin.multi { width: 22px; height: 22px; margin: -11px 0 0 -11px; font-size: 11px; }
  .pin::after {
    content: ""; position: absolute; inset: -6px;
    border-radius: 50%; border: 1px solid var(--ink);
    animation: pin-pulse 2.4s ease-out infinite;
    pointer-events: none;
  }
  @keyframes pin-pulse {
    from { transform: scale(0.55); opacity: 0.55; }
    to   { transform: scale(1.5);  opacity: 0; }
  }
  .pin:hover, .pin.on, .pin:focus-visible { box-shadow: 0 0 0 5px rgba(38, 38, 38, 0.2); outline: none; }
  .globe-hint {
    margin: 22px 0 0;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
  }
  .globe-fallback { max-width: 560px; font-size: 14px; line-height: 1.6; }
  .globe-fallback h3 {
    margin: 22px 0 6px; font-size: 12px; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  }
  .globe-fallback a { display: block; text-decoration: underline; text-underline-offset: 3px; }

  /* popup that appears when you hover a pin */
  .gpop {
    position: fixed; z-index: 30;
    width: min(320px, calc(100vw - 24px));
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.16);
    font-size: 12px; line-height: 1.4;
  }
  .gpop[hidden] { display: none; }
  .gp-place {
    padding: 12px 14px 10px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
  }
  .gp-list { border-top: 1px solid var(--line); }
  .gp-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
  }
  .gp-item .d { font-size: 11px; white-space: nowrap; }
  .gp-item.on, .gp-item:hover { color: var(--ink); background: rgba(38, 38, 38, 0.045); }
  .gp-mq { overflow: hidden; }
  .gp-track {
    display: flex; width: max-content;
    animation: gp-scroll 20s linear infinite;
  }
  .gp-group { display: flex; flex-shrink: 0; }
  @keyframes gp-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .gp-thumb {
    position: relative; display: block;
    flex: 0 0 120px; width: 120px; height: 80px;
    margin-right: 6px;
    background: var(--tile);
    overflow: hidden;
  }
  .gp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gp-thumb .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em; font-size: 11px;
  }
  .gp-empty { padding: 14px; color: var(--muted); }
  .gp-foot {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 14px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
  .gp-foot a { color: var(--ink); text-decoration: none; }
  .gp-foot a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- index page (list of every event) ---------- */
  .index { max-width: 900px; }
  .ix-row {
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr 70px;
    gap: 16px;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px;
  }
  .ix-head { color: var(--muted); font-size: 11px; padding-top: 0; }
  a.ix-row span:nth-child(n+2) { color: var(--muted); }
  a.ix-row:hover span { color: var(--ink); }
  .ix-row span:last-child { text-align: right; }

  /* ---------- text pages ---------- */
  .text-page { max-width: 560px; padding-top: 4px; font-size: 15px; line-height: 1.6; }
  .text-page h1 {
    font-size: 13px; font-weight: normal; text-transform: uppercase;
    letter-spacing: 0.06em; margin: 0 0 22px;
  }
  .text-page p { margin: 0 0 1.1em; }
  .text-page a { text-decoration: underline; text-underline-offset: 3px; }

  footer {
    padding: 56px 36px 28px 0;
    font-size: 11px; color: var(--muted);
  }

  /* ---------- hover preview (desktop): photo goes fullscreen while you rest on it ---------- */
  .peek {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.18s ease, visibility 0.18s;
    pointer-events: none;            /* so the photo underneath keeps the hover */
  }
  .peek.on { opacity: 1; visibility: visible; }
  .peek img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .peek .ph-big {
    width: min(100%, 1100px); aspect-ratio: 16 / 9;
    background: var(--tile);
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em;
  }
  #peekStage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* small camera-settings popup, bottom right of the enlarged photo */
  .peek-info {
    position: absolute; right: 28px; bottom: 28px;
    max-width: 340px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 12px; line-height: 1.5;
  }
  .peek-info:empty { display: none; }
  .peek-info .l1 { color: var(--ink); }
  .peek-info .l2 { color: var(--muted); margin-top: 2px; letter-spacing: 0.02em; }

  /* ---------- fullscreen viewer + info window ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(217, 217, 215, 0.98);
    display: none;
  }
  .lb.on { display: flex; flex-direction: row; }
  .lb-main {
    position: relative;
    flex: 1; min-width: 0;
    padding: 56px 72px;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-stage .ph-big {
    width: min(100%, 1100px); aspect-ratio: 16 / 9;
    background: var(--tile);
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em;
  }
  .lb button.ctl2 {
    position: absolute; z-index: 2;
    font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }
  .lb button.ctl2:hover, .lb button.ctl2[aria-pressed="true"] { color: var(--ink); }
  .lb .close   { top: 22px; right: 28px; }
  .lb .infobtn { top: 22px; right: 92px; }
  .lb .prev { left: 22px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 22px; top: 50%; transform: translateY(-50%); }
  .lb .count { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); }

  .lb-info {
    display: none;
    width: 290px; flex-shrink: 0;
    margin: 64px 28px 28px 0;
    padding: 20px;
    align-self: flex-start;
    max-height: calc(100vh - 92px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 12px; line-height: 1.5;
  }
  .lb.info-on .lb-info { display: block; }
  .i-sec { margin-bottom: 20px; }
  .i-sec:last-child { margin-bottom: 0; }
  .i-title { text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .i-head { text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .i-row { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .i-row span:first-child { color: var(--muted); flex-shrink: 0; }
  .i-row span:last-child { text-align: right; }
  .i-desc { margin: 12px 0 0; }
  .i-sec .i-desc:first-child { margin-top: 0; }

  /* ---------- tablet / mobile ---------- */
  @media (max-width: 1000px) {
    .layout-grid   { --cols: 2; }
    .layout-square { --cols: 3; }
    .layout-masonry { column-count: 2; }
  }
  @media (max-width: 900px) {
    .lb.on { flex-direction: column; }
    .lb-main { padding: 56px 12px 8px; }
    .lb-info { width: auto; margin: 0 12px 12px; max-height: 38vh; align-self: stretch; }
    .lb .prev { left: 6px; } .lb .next { right: 6px; }
  }
  @media (max-width: 720px) {
    .sidebar {
      position: sticky; top: 0; bottom: auto; width: 100%;
      padding: 16px 18px; overflow: visible;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .logo { margin: 0; }
    .logo img { width: min(var(--logo-width), 120px); }
    .menu-toggle { display: block; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); }
    .nav { display: none; width: 100%; padding-top: 22px; }
    .nav.open { display: block; }
    main { margin-left: 0; padding: 12px 0 0 12px; }
    .view { padding-right: 12px; }
    footer { padding-right: 12px; }
    .layout-grid, .layout-wide { --cols: 1; }
    .ix-row { grid-template-columns: 1fr auto; }
    .ix-row span:nth-child(3), .ix-row span:nth-child(4) { display: none; }
    .layout-square { --cols: 2; }
    .layout-masonry { column-count: 2; }
    :root { --m-h: clamp(160px, 38vh, 320px); --m-gap: 12px; --gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pin::after { animation: none; opacity: 0; }
    .logo img, .logo .logo-text { animation: none; }
    .gp-track { animation: none; }
    .gp-mq { overflow-x: auto; }
    .gp-group[aria-hidden="true"] { display: none; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <a class="logo" href="#home" id="logo">
    <img id="logoImg" alt="" style="display:none">
    <span class="logo-text" id="logoText" style="display:none"></span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-expanded="false">Menu</button>
  <ul class="nav" id="nav"></ul>
</aside>
<div class="scrim" aria-hidden="true"></div>

<main>
  <!-- home: marquee of cover photos -->
  <section class="view on" id="view-home">
    <div class="marquee" id="marquee">
      <div class="track" id="track"></div>
    </div>
  </section>

  <!-- globe: every event on a map of the world -->
  <section class="view" id="view-globe">
    <div class="collection-head">
      <div class="ch-title">Globe</div>
      <div class="ch-meta" id="globeMeta"></div>
    </div>

  <!-- index: a list of every event -->

    <div class="collection-head">

    <div class="grid" id="grid"></div>

  <!-- about -->

  <footer>&copy; <span id="yr">2026</span> <span id="siteName"></span>. All rights reserved.</footer>
</main>

<!-- globe pin popup -->
<div class="gpop" id="gpop" role="dialog" aria-label="Events at this location" hidden></div>

<!-- hover preview -->
<div class="peek" id="peek" aria-hidden="true">
  <div id="peekStage"></div>

</div>

  <button class="ctl2 infobtn" id="lbInfoBtn" aria-pressed="true">Info</button>
  <button class="ctl2 close" id="lbClose">Close</button>
  <div class="lb-main" id="lbMain">
    <button class="ctl2 prev" id="lbPrev" aria-label="Previous photo">Prev</button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="ctl2 next" id="lbNext" aria-label="Next photo">Next</button>
    <div class="count" id="lbCount"></div>

</div>

<!-- your content -->
<script src="events.js"></script>
<!-- map tools for the globe (loaded from a public CDN) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<script>
/* ============================================================
   The site's code. You should not need to edit anything below:
   all your content and settings live in events.js.
   ============================================================ */

if (typeof COLLECTIONS === 'undefined') {
  document.body.innerHTML = '<p style="font:15px/1.6 Helvetica,Arial,sans-serif;padding:40px;max-width:560px">' +
    'events.js was not found. Upload events.js to the same place as index.html in your repo.</p>';
  throw new Error('events.js is missing');
}

const site = (typeof SITE !== 'undefined' && SITE) || {};
const CFG = Object.assign(
  { marqueeSpeed: 50, peekDelay: 2500, globeSpin: 4, logoWidth: 150, logoSway: 14 },
  (typeof SETTINGS !== 'undefined' && SETTINGS) || {}
);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const nav = $('nav'), grid = $('grid'), track = $('track'), marquee = $('marquee');
const views = ['home', 'globe', 'index', 'collection', 'about', 'contact'];
const homeOn = () => $('view-home').classList.contains('on');
const globeOn = () => $('view-globe').classList.contains('on');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

/* ---------- site name, logo, About, Contact (all from events.js) ---------- */
const SITE_NAME = site.name || 'Allwood Archives';
document.title = SITE_NAME;
$('siteName').textContent = SITE_NAME;
document.documentElement.style.setProperty('--logo-width', (Number(CFG.logoWidth) || 150) + 'px');
document.documentElement.style.setProperty('--sway', (Number(CFG.logoSway) || 0) + 'deg');

(function setupLogo() {
  const img = $('logoImg'), txt = $('logoText');
  txt.innerHTML = esc(SITE_NAME).replace(' ', '<br>');
  img.alt = SITE_NAME;
  img.onload = () => { img.style.display = 'block'; txt.style.display = 'none'; };
  img.onerror = () => { img.style.display = 'none'; txt.style.display = 'block'; };
  img.src = site.logo || 'images/logo.png';
})();

(function setupTextPages() {
  const about = Array.isArray(site.about) ? site.about : [];
  $('aboutBody').innerHTML = about.map(p => `<p>${esc(p)}</p>`).join('');

  const ct = site.contact || {};
  let h = '';
  if (ct.email) h += `<p>For inquiries, email <a href="mailto:${esc(ct.email)}">${esc(ct.email)}</a>.</p>`;
  const links = Array.isArray(ct.links) ? ct.links : [];
  if (links.length) {
    h += '<p>' + links.map(l => {
      const ext = /^https?:/i.test(l.url || '');
      return `<a href="${esc(l.url || '#')}"${ext ? ' target="_blank" rel="noopener"' : ''}>${esc(l.label)}</a>`;
    }).join('<br>') + '</p>';
  }
  $('contactBody').innerHTML = h;
})();

/* a photo can be written as just a path or as an object; make them all objects */
COLLECTIONS.forEach(c => {
  c.photos = (c.photos || []).map(p => (typeof p === 'string' ? { src: p } : p));
});

let currentColl = null;
let lbIndex = 0;

function coverOf(c) {
  return c.cover || (c.photos.find(p => p.src) || {}).src || '';
}

/* ---------- nav ---------- */
function buildNav() {
  const latest = COLLECTIONS.find(c => c.latest) || COLLECTIONS[COLLECTIONS.length - 1];
  const link = (href, route, label, title) =>
    `<li><a href="${href}" data-route="${route}"${title ? ` title="${esc(title)}"` : ''}>${label}</a></li>`;

  let home = '';
  if (latest) home += link('#' + esc(latest.id), 'latest', 'Latest', latest.title);
  home += link('#globe', 'globe', 'Globe');
  home += link('#index', 'index', 'Index');

  const projects = COLLECTIONS.map(c => link('#' + esc(c.id), esc(c.id), esc(c.title))).join('');
  const info = link('#about', 'about', 'About') + link('#contact', 'contact', 'Contact');

  nav.innerHTML =
    `<li class="sec"><div class="head"><a href="#home" data-route="home">Home</a></div>` +
      `<div class="subs"><ul>${home}</ul></div></li>` +
    `<li class="sec"><div class="head" tabindex="0">Projects</div>` +
      `<div class="subs"><ul>${projects}</ul></div></li>` +
    `<li class="sec"><div class="head" tabindex="0">Info</div>` +
      `<div class="subs"><ul>${info}</ul></div></li>`;
}

/* Every name in the sidebar stays on one line. When you hover the sidebar it
   widens to fit the longest name (and the page behind it blurs), so nothing
   is ever cut off. */
const sidebar = document.querySelector('.sidebar');
function measureSidebar() {
  const cs = getComputedStyle(sidebar);
  const padding = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  let widest = 0;
  nav.querySelectorAll('a').forEach(a => { widest = Math.max(widest, a.scrollWidth); });
  const needed = Math.ceil(widest * 1.1) + padding + 8;   // +10% for the hover zoom
  document.documentElement.style.setProperty('--sidebar-open', Math.max(240, needed) + 'px');
}
/* after you pick a page the sidebar tucks away at once so you can see it;
   move the mouse off and back on to open it again */
nav.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  sidebar.classList.add('closed');
  a.blur();                                  // so keyboard focus doesn't hold the sidebar open
});
sidebar.addEventListener('mouseleave', () => sidebar.classList.remove('closed'));

function showView(name) {
  views.forEach(v => $('view-' + v).classList.toggle('on', v === name));
}

/* ---------- home marquee ----------
   One row of cover photos that drifts left forever. Drag it with the
   mouse or your finger (either direction) and it carries on from where
   you let go. The row is built twice back to back and wraps around,
   so there is never a visible seam. */
let groupW = 0, offset = 0, vel = 0;
let dragging = false, moved = false, hovering = false, suppressClick = false;
let startX = 0, startOffset = 0, lastX = 0, lastT = 0, lastFrame = performance.now();

function makeItem(c, isCopy) {
  const a = document.createElement('a');
  a.className = 'm-item';
  a.href = '#' + c.id;
  a.draggable = false;
  a.setAttribute('aria-label', 'Open ' + c.title);
  if (isCopy) { a.tabIndex = -1; a.setAttribute('aria-hidden', 'true'); }
  const src = coverOf(c);
  const n = c.photos.length;
  a.innerHTML =
    `<span class="m-img">` +
      (src ? `<img src="${esc(src)}" alt="${esc(c.title)}" draggable="false">`
           : `<span class="ph">${esc(c.title)}</span>`) +
    `</span>` +
    `<span class="m-cap">${esc(c.title)}<span>${n} photo${n === 1 ? '' : 's'}</span></span>`;
  return a;
}

function wrapOffset() {
  if (groupW) offset = ((offset % groupW) + groupW) % groupW;
}

function buildMarquee() {
  track.innerHTML = '';
  if (!COLLECTIONS.length) return;

  const group = document.createElement('div');
  group.className = 'group';
  COLLECTIONS.forEach(c => group.appendChild(makeItem(c, false)));
  track.appendChild(group);

  const setW = group.offsetWidth;            // needs the Home page to be visible
  if (!setW) return;

  const reps = Math.max(1, Math.ceil(marquee.clientWidth / setW));
  for (let r = 1; r < reps; r++) {
    COLLECTIONS.forEach(c => group.appendChild(makeItem(c, true)));
  }

  const copy = group.cloneNode(true);
  copy.setAttribute('aria-hidden', 'true');
  copy.querySelectorAll('a').forEach(a => { a.tabIndex = -1; a.draggable = false; });
  track.appendChild(copy);

  groupW = group.offsetWidth;
  wrapOffset();
  track.style.transform = `translate3d(${-offset}px,0,0)`;
}

function marqueeStep(dt) {
  if (!groupW) return;
  if (!dragging) {
    const base = (hovering || reduceMotion) ? 0 : CFG.marqueeSpeed;   // pauses while the mouse is over it
    offset += (base + vel) * dt;
    vel *= Math.exp(-3.5 * dt);                                       // let-go momentum fades out
    if (Math.abs(vel) < 2) vel = 0;
  }
  wrapOffset();
  track.style.transform = `translate3d(${-offset}px,0,0)`;
}

marquee.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  dragging = true; moved = false;
  startX = lastX = e.clientX;
  startOffset = offset;
  lastT = performance.now();
  vel = 0;
});
marquee.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  if (!moved && Math.abs(dx) > 5) {
    moved = true;
    marquee.classList.add('dragging');
    try { marquee.setPointerCapture(e.pointerId); } catch (_) {}
  }
  if (!moved) return;
  offset = startOffset - dx;
  const now = performance.now(), dtm = (now - lastT) / 1000;
  if (dtm > 0) vel = vel * 0.6 + (-(e.clientX - lastX) / dtm) * 0.4;
  lastX = e.clientX; lastT = now;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  marquee.classList.remove('dragging');
  if (performance.now() - lastT > 90) vel = 0;                       // held still before letting go
  vel = clamp(vel, -2500, 2500);
  if (moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }
}
marquee.addEventListener('pointerup', endDrag);
marquee.addEventListener('pointercancel', endDrag);
marquee.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') hovering = true; });
marquee.addEventListener('pointerleave', () => { hovering = false; });
marquee.addEventListener('click', e => {                              // a drag should not count as a click
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); }
}, true);
marquee.addEventListener('dragstart', e => e.preventDefault());
marquee.addEventListener('wheel', e => {                              // trackpad side-swipe also moves it
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { e.preventDefault(); offset += e.deltaX; }
}, { passive: false });

/* ---------- globe ----------
   An orthographic globe drawn on a canvas with d3-geo. Each event with
   coords gets a pin. Events at the same spot share one pin. */
const LAND_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json';
const hasD3 = typeof d3 !== 'undefined' && !!d3.geoOrthographic;
const gwrap = $('globeWrap'), gcanvas = $('globeCanvas'), gpins = $('pins'), gpop = $('gpop');

/* group events that share a location */
const groups = [];
COLLECTIONS.forEach(c => {
  if (!Array.isArray(c.coords) || c.coords.length < 2) return;
  const lat = Number(c.coords[0]), lon = Number(c.coords[1]);
  if (!isFinite(lat) || !isFinite(lon)) return;
  const key = lat.toFixed(2) + ',' + lon.toFixed(2);
  let grp = groups.find(x => x.key === key);
  if (!grp) { grp = { key, lat, lon, place: c.location || 'Location', events: [] }; groups.push(grp); }
  grp.events.push(c);
});

const g = {
  size: 0, rot: [-20, -20], vel: [0, 0],
  down: false, moved: false, dragging: false, hover: false,
  sx: 0, sy: 0, lx: 0, ly: 0, lt: 0,
  land: null, pins: [], colors: null
};
let proj = null, gpath = null, grat = null, gctx = null, globeInit = false;

function refreshGlobeColors() {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  g.colors = {
    ocean: css('--tile'),
    land: css('--panel'),
    coast: 'rgba(92, 92, 90, 0.55)',
    grat: 'rgba(38, 38, 38, 0.07)',
    rim: 'rgba(38, 38, 38, 0.35)'
  };
}

function sizeGlobe() {
  const area = $('globeArea');
  if (!area.clientWidth) return;
  const s = Math.floor(Math.min(area.clientWidth, window.innerHeight * 0.7, 780));
  g.size = s;
  gwrap.style.width = s + 'px';
  gwrap.style.height = s + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  gcanvas.width = Math.round(s * dpr);
  gcanvas.height = Math.round(s * dpr);
  gcanvas.style.width = s + 'px';
  gcanvas.style.height = s + 'px';
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  proj.translate([s / 2, s / 2]).scale(s / 2 - 4);
}

function drawGlobe() {
  const s = g.size, c = g.colors;
  proj.rotate([g.rot[0], g.rot[1]]);
  const sphere = { type: 'Sphere' };
  gctx.clearRect(0, 0, s, s);

  gctx.beginPath(); gpath(sphere);
  gctx.fillStyle = c.ocean; gctx.fill();

  gctx.beginPath(); gpath(grat);
  gctx.strokeStyle = c.grat; gctx.lineWidth = 0.6; gctx.stroke();

  if (g.land) {
    gctx.beginPath(); gpath(g.land);
    gctx.fillStyle = c.land; gctx.fill();
    gctx.strokeStyle = c.coast; gctx.lineWidth = 0.7; gctx.stroke();
  }

  /* soft shading so it reads as a ball */
  const grad = gctx.createRadialGradient(s * 0.36, s * 0.32, s * 0.08, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.20)');
  grad.addColorStop(0.6, 'rgba(255, 255, 255, 0)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0.12)');
  gctx.beginPath(); gpath(sphere);
  gctx.fillStyle = grad; gctx.fill();

  gctx.beginPath(); gpath(sphere);
  gctx.strokeStyle = c.rim; gctx.lineWidth = 1; gctx.stroke();
}

function placePins() {
  const center = [-g.rot[0], -g.rot[1]];
  g.pins.forEach(p => {
    const xy = proj([p.lon, p.lat]);
    if (!xy) { p.el.style.opacity = 0; p.el.style.pointerEvents = 'none'; return; }
    const front = Math.cos(d3.geoDistance([p.lon, p.lat], center));   // > 0 means it faces us
    const o = clamp(front * 6, 0, 1);                                  // fades out near the edge
    p.el.style.transform = `translate(${xy[0].toFixed(1)}px, ${xy[1].toFixed(1)}px)`;
    p.el.style.opacity = o;
    const live = o > 0.4;
    p.el.style.pointerEvents = live ? 'auto' : 'none';
    p.el.tabIndex = live ? 0 : -1;
  });
}

function globeStep(dt) {
  if (!globeInit || !g.size) return;
  if (!g.dragging) {
    const spin = (CFG.globeSpin > 0 && !reduceMotion && !g.hover && gpop.hidden) ? CFG.globeSpin : 0;
    g.rot[0] += (spin + g.vel[0]) * dt;
    g.rot[1] = clamp(g.rot[1] + g.vel[1] * dt, -75, 75);
    const k = Math.exp(-3 * dt);
    g.vel[0] *= k; g.vel[1] *= k;
    if (Math.abs(g.vel[0]) < 0.05) g.vel[0] = 0;
    if (Math.abs(g.vel[1]) < 0.05) g.vel[1] = 0;
    if (Math.abs(g.rot[0]) > 360) g.rot[0] %= 360;
  }
  drawGlobe();
  placePins();
}

/* the popup that opens when you hover a pin: a small menu of that place's events
   plus a mini marquee of the highlighted event's photos */
let popGroup = null, popPin = null, popTimer = null;

function thumb(p, i) {
  return `<span class="gp-thumb">` +
    (p.src ? `<img src="${esc(p.src)}" alt="" loading="lazy" draggable="false">`
           : `<span class="ph">${pad(i + 1)}</span>`) +
    `</span>`;
}
function miniMarquee(c) {
  const list = c.photos.length ? c.photos.slice(0, 12) : (c.cover ? [{ src: c.cover }] : []);
  if (!list.length) return `<div class="gp-empty">No photos yet</div>`;
  const unit = 126;                                                    // thumbnail + gap
  const reps = Math.max(1, Math.ceil(340 / (list.length * unit)));    // repeat so a short set still fills the width
  let one = '';
  for (let r = 0; r < reps; r++) list.forEach((p, i) => { one += thumb(p, i); });
  const dur = Math.max(8, (list.length * reps * unit) / 32);
  return `<div class="gp-mq"><div class="gp-track" style="animation-duration:${dur}s">` +
           `<div class="gp-group">${one}</div><div class="gp-group" aria-hidden="true">${one}</div>` +
         `</div></div>`;
}
function popBody(c) {
  const n = c.photos.length;
  return miniMarquee(c) +
    `<div class="gp-foot"><span>${n} photo${n === 1 ? '' : 's'}</span>` +
    `<a href="#${esc(c.id)}">View event &rarr;</a></div>`;
}
function popHTML(grp) {
  const rows = grp.events.map((c, i) =>
    `<a class="gp-item${i === 0 ? ' on' : ''}" href="#${esc(c.id)}" data-i="${i}">` +
      `<span>${esc(c.title)}</span><span class="d">${esc(c.date || '')}</span></a>`
  ).join('');
  return `<div class="gp-place">${esc(grp.place)}</div>` +
         `<div class="gp-list">${rows}</div>` +
         `<div class="gp-body">${popBody(grp.events[0])}</div>`;
}
function setPopActive(i) {
  if (!popGroup) return;
  gpop.querySelectorAll('.gp-item').forEach((el, k) => el.classList.toggle('on', k === i));
  gpop.querySelector('.gp-body').innerHTML = popBody(popGroup.events[i]);
}
function positionPop(pinEl) {
  const r = pinEl.getBoundingClientRect();
  const w = gpop.offsetWidth, h = gpop.offsetHeight;
  let left, top;
  if (window.innerWidth < 640) {                                       // phones: centered under (or over) the pin
    left = Math.max(12, (window.innerWidth - w) / 2);
    top = r.bottom + 14;
    if (top + h > window.innerHeight - 12) top = r.top - h - 14;
  } else {
    left = r.right + 14;
    if (left + w > window.innerWidth - 12) left = r.left - w - 14;
    top = r.top + r.height / 2 - 28;
  }
  left = clamp(left, 12, Math.max(12, window.innerWidth - w - 12));
  top = clamp(top, 12, Math.max(12, window.innerHeight - h - 12));
  gpop.style.left = left + 'px';
  gpop.style.top = top + 'px';
}
function openPop(grp, pinEl) {
  clearTimeout(popTimer);
  if (popGroup === grp && !gpop.hidden) return;
  if (popPin) popPin.classList.remove('on');
  popGroup = grp; popPin = pinEl;
  pinEl.classList.add('on');
  gpop.innerHTML = popHTML(grp);
  gpop.querySelectorAll('.gp-item').forEach((el, i) => {
    el.addEventListener('mouseenter', () => setPopActive(i));
    el.addEventListener('focus', () => setPopActive(i));
  });
  gpop.hidden = false;
  positionPop(pinEl);
}
function closePop() {
  clearTimeout(popTimer);
  if (popPin) popPin.classList.remove('on');
  gpop.hidden = true;
  popGroup = null; popPin = null;
}
function schedulePopClose() {
  clearTimeout(popTimer);
  popTimer = setTimeout(closePop, 260);                                // a short grace period to move from pin to popup
}
gpop.addEventListener('mouseenter', () => clearTimeout(popTimer));
gpop.addEventListener('mouseleave', schedulePopClose);
gpop.addEventListener('focusin', () => clearTimeout(popTimer));
gpop.addEventListener('focusout', schedulePopClose);
document.addEventListener('pointerdown', e => {                        // tap or click anywhere else closes it
  if (!gpop.hidden && !gpop.contains(e.target) && !(e.target.closest && e.target.closest('.pin'))) closePop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !gpop.hidden) closePop(); });

function buildPins() {
  gpins.innerHTML = '';
  g.pins = groups.map(grp => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'pin' + (grp.events.length > 1 ? ' multi' : '');
    el.textContent = grp.events.length > 1 ? String(grp.events.length) : '';
    el.setAttribute('aria-label', `${grp.place}: ${grp.events.length} event${grp.events.length === 1 ? '' : 's'}`);
    el.addEventListener('mouseenter', () => openPop(grp, el));
    el.addEventListener('mouseleave', schedulePopClose);
    el.addEventListener('focus', () => openPop(grp, el));
    el.addEventListener('blur', schedulePopClose);
    el.addEventListener('click', () => openPop(grp, el));
    gpins.appendChild(el);
    return { grp, el, lat: grp.lat, lon: grp.lon };
  });
}

/* drag to turn the globe */
gwrap.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  g.down = true; g.moved = false;
  g.sx = g.lx = e.clientX; g.sy = g.ly = e.clientY;
  g.lt = performance.now();
  g.vel = [0, 0];
});
gwrap.addEventListener('pointermove', e => {
  if (!g.down) return;
  if (!g.moved && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > 5) {
    g.moved = true; g.dragging = true;
    gwrap.classList.add('dragging');
    closePop();
    try { gwrap.setPointerCapture(e.pointerId); } catch (_) {}
  }
  if (!g.moved || !g.size) return;
  const k = 180 / (Math.PI * (g.size / 2));                            // degrees per pixel at the centre
  const ddx = e.clientX - g.lx, ddy = e.clientY - g.ly;
  g.rot[0] += ddx * k;
  g.rot[1] = clamp(g.rot[1] - ddy * k, -75, 75);
  const now = performance.now(), dtm = (now - g.lt) / 1000;
  if (dtm > 0) {
    g.vel[0] = g.vel[0] * 0.6 + ((ddx * k) / dtm) * 0.4;
    g.vel[1] = g.vel[1] * 0.6 + ((-ddy * k) / dtm) * 0.4;
  }
  g.lx = e.clientX; g.ly = e.clientY; g.lt = now;
});
function endGlobeDrag() {
  if (!g.down) return;
  g.down = false; g.dragging = false;
  gwrap.classList.remove('dragging');
  if (performance.now() - g.lt > 90) g.vel = [0, 0];
  g.vel = [clamp(g.vel[0], -300, 300), clamp(g.vel[1], -300, 300)];
}
gwrap.addEventListener('pointerup', endGlobeDrag);
gwrap.addEventListener('pointercancel', endGlobeDrag);
gwrap.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') g.hover = true; });   // stops spinning so pins hold still
gwrap.addEventListener('pointerleave', () => { g.hover = false; });

function initGlobe() {
  globeInit = true;
  gctx = gcanvas.getContext('2d');
  proj = d3.geoOrthographic().clipAngle(90).precision(0.6);
  gpath = d3.geoPath(proj, gctx);
  grat = d3.geoGraticule10();
  if (groups.length) g.rot = [-groups[0].lon, clamp(-groups[0].lat, -60, 60)];   // start facing the first pin
  buildPins();
  if (typeof topojson !== 'undefined') {
    fetch(LAND_URL)
      .then(r => r.json())
      .then(topo => { g.land = topojson.feature(topo, topo.objects.land); })
      .catch(() => {});                                                          // no map data: the globe still works, just without continents
  }
}

/* plain list shown if the map tools could not load, or no event has coords yet */
function showGlobeFallback(message) {
  gwrap.style.display = 'none';
  $('globeHint').style.display = 'none';
  const box = $('globeFallback');
  let h = `<p>${esc(message)}</p>`;
  groups.forEach(grp => {
    h += `<h3>${esc(grp.place)}</h3>` +
         grp.events.map(c => `<a href="#${esc(c.id)}">${esc(c.title)}${c.date ? ' \u00b7 ' + esc(c.date) : ''}</a>`).join('');
  });
  box.innerHTML = h;
  box.hidden = false;
}

function openGlobe() {
  const n = groups.reduce((sum, grp) => sum + grp.events.length, 0);
  $('globeMeta').textContent = `${n} event${n === 1 ? '' : 's'} \u00b7 ${groups.length} place${groups.length === 1 ? '' : 's'}`;
  if (!groups.length) {
    showGlobeFallback('No events have a location on the map yet. Add coords: [latitude, longitude] to an event in events.js.');
    return;
  }
  if (!hasD3) {
    showGlobeFallback('The globe could not load (it needs an internet connection). Here are your events by place:');
    return;
  }
  if (!globeInit) initGlobe();
  refreshGlobeColors();
  sizeGlobe();
}

/* ---------- one animation loop for the marquee and the globe ---------- */
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (homeOn()) marqueeStep(dt);
  else if (globeOn()) globeStep(dt);
  requestAnimationFrame(frame);
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    measureSidebar();
    if (homeOn()) buildMarquee();
    if (globeOn() && globeInit) { closePop(); sizeGlobe(); }
  }, 200);
});

/* ---------- hover preview (desktop only) ---------- */
const peek = $('peek'), peekStage = $('peekStage'), peekInfo = $('peekInfo');
let peekTimer;

/* condensed camera settings for the popup: two short lines, blanks skipped */
function condensedGear(c, p) {
  const gear = c.gear || {};
  const pick = k => p[k] || gear[k] || '';
  const iso = pick('iso');
  const line1 = [pick('camera'), pick('lens')].filter(Boolean).join('  \u00b7  ');
  const line2 = [
    pick('focal'), pick('aperture'), pick('shutter'),
    iso ? (/^\d+$/.test(String(iso).trim()) ? 'ISO ' + iso : iso) : ''
  ].filter(Boolean).join('  \u00b7  ');
  let h = '';
  if (line1) h += `<div class="l1">${esc(line1)}</div>`;
  if (line2) h += `<div class="l2">${esc(line2)}</div>`;
  return h;
}

function showPeek(c, p, idx) {
  peekStage.innerHTML = p.src
    ? `<img src="${esc(p.src)}" alt="">`
    : `<div class="ph-big">${pad(idx + 1)}</div>`;
  peekInfo.innerHTML = condensedGear(c, p);
  peek.classList.add('on');
}
function hidePeek() { clearTimeout(peekTimer); peek.classList.remove('on'); }

/* ---------- index page ---------- */
function renderIndex() {
  $('indexMeta').textContent = COLLECTIONS.length + (COLLECTIONS.length === 1 ? ' event' : ' events');
  let h = `<div class="ix-row ix-head"><span>Event</span><span>Date</span><span>Location</span><span>Photos</span></div>`;
  COLLECTIONS.forEach(c => {
    h += `<a class="ix-row" href="#${esc(c.id)}">` +
           `<span>${esc(c.title)}</span><span>${esc(c.date || '')}</span>` +
           `<span>${esc(c.location || '')}</span><span>${c.photos.length}</span>` +
         `</a>`;
  });
  $('indexList').innerHTML = h;
}

/* ---------- collection page ---------- */
function renderCollection(c) {
  currentColl = c;
  hidePeek();
  $('collTitle').textContent = c.title;
  $('collMeta').textContent = [c.date, c.location, c.photos.length + (c.photos.length === 1 ? ' photo' : ' photos')]
    .filter(Boolean).join('  \u00b7  ');
  $('collDesc').textContent = c.description || '';
  $('collDesc').style.display = c.description ? '' : 'none';

  const layout = ['grid', 'square', 'wide', 'masonry'].includes(c.layout) ? c.layout : 'grid';
  grid.className = 'grid layout-' + layout;
  grid.innerHTML = '';

  c.photos.forEach((p, idx) => {
    const b = document.createElement('button');
    b.className = 'tile' + (layout === 'masonry' && !p.src ? ' r' + (idx % 4) : '');
    b.setAttribute('aria-label', `View photo ${idx + 1} of ${c.title}`);
    b.innerHTML = p.src
      ? `<img src="${esc(p.src)}" alt="${esc(p.caption || c.title + ' photo ' + (idx + 1))}" loading="lazy">`
      : `<span class="ph">${pad(idx + 1)}</span>`;
    b.addEventListener('click', () => openLb(idx));
    if (canHover) {
      let ax = 0, ay = 0;                                   // where the cursor started resting
      const arm = () => {
        clearTimeout(peekTimer);
        peekTimer = setTimeout(() => showPeek(c, p, idx), CFG.peekDelay);
      };
      b.addEventListener('mouseenter', e => { ax = e.clientX; ay = e.clientY; arm(); });
      b.addEventListener('mousemove', e => {
        if (peek.classList.contains('on')) return;          // already enlarged
        if (Math.hypot(e.clientX - ax, e.clientY - ay) > 12) {   // cursor moved: start the wait over
          ax = e.clientX; ay = e.clientY; arm();
        }
      });
      b.addEventListener('mouseleave', hidePeek);
    }
    grid.appendChild(b);
  });
}

/* ---------- routing ---------- */
function route() {
  const hash = (location.hash || '').replace('#', '');
  let target = hash || 'home';
  const coll = COLLECTIONS.find(c => c.id === target);

  hidePeek();
  closePop();
  if (target === 'about') showView('about');
  else if (target === 'contact') showView('contact');
  else if (target === 'globe') { showView('globe'); openGlobe(); }
  else if (target === 'index') { renderIndex(); showView('index'); }
  else if (coll) { renderCollection(coll); showView('collection'); }
  else {
    target = 'home';
    showView('home');
    buildMarquee();
  }

  nav.querySelectorAll('[data-route]').forEach(a => {
    a.classList.toggle('active', a.dataset.route === target);
  });
  nav.classList.remove('open');
  $('menuToggle').setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}

/* ---------- fullscreen viewer + info window ---------- */
const lb = $('lb'), lbStage = $('lbStage'), lbCount = $('lbCount'), lbInfo = $('lbInfo');
let infoOpen = window.innerWidth > 900;     // starts open on computers, closed on phones

function infoRow(label, value) {
  return `<div class="i-row"><span>${esc(label)}</span><span>${esc(value)}</span></div>`;
}
function infoHTML(c, p) {
  const gear = c.gear || {};
  const pick = k => p[k] || gear[k] || '';
  let h = `<div class="i-sec"><div class="i-title">${esc(c.title)}</div>`;
  const date = p.date || c.date, loc = p.location || c.location;
  if (date) h += infoRow('Date', date);
  if (loc) h += infoRow('Location', loc);
  if (c.description) h += `<p class="i-desc">${esc(c.description)}</p>`;
  h += `</div>`;

  const cam = [
    ['Camera', 'camera'], ['Lens', 'lens'], ['Focal length', 'focal'],
    ['Aperture', 'aperture'], ['Shutter', 'shutter'], ['ISO', 'iso']
  ].map(([label, key]) => [label, pick(key)]).filter(r => r[1]);
  if (cam.length) {
    h += `<div class="i-sec"><div class="i-head">Camera</div>${cam.map(r => infoRow(r[0], r[1])).join('')}</div>`;
  }
  if (p.caption) {
    h += `<div class="i-sec"><div class="i-head">Notes</div><p class="i-desc">${esc(p.caption)}</p></div>`;
  }
  return h;
}

function drawLb() {
  const photos = currentColl.photos;
  const p = photos[lbIndex];
  lbStage.innerHTML = p.src
    ? `<img src="${esc(p.src)}" alt="${esc(p.caption || currentColl.title)}">`
    : `<div class="ph-big">${pad(lbIndex + 1)}</div>`;
  lbCount.textContent = `${lbIndex + 1} / ${photos.length}`;
  lbInfo.innerHTML = infoHTML(currentColl, p);
}
function setInfo(open) {
  infoOpen = open;
  lb.classList.toggle('info-on', open);
  $('lbInfoBtn').setAttribute('aria-pressed', open);
}
function openLb(i) {
  hidePeek();
  lbIndex = i;
  setInfo(infoOpen);
  drawLb();
  lb.classList.add('on');
  lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  lb.classList.remove('on');
  lb.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
function stepLb(d) {
  const n = currentColl.photos.length;
  if (!n) return;
  lbIndex = (lbIndex + d + n) % n;
  drawLb();
}

$('lbClose').addEventListener('click', closeLb);
$('lbPrev').addEventListener('click', () => stepLb(-1));
$('lbNext').addEventListener('click', () => stepLb(1));
$('lbInfoBtn').addEventListener('click', () => setInfo(!infoOpen));
$('lbMain').addEventListener('click', e => { if (e.target === $('lbMain') || e.target === lbStage) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') stepLb(-1);
  if (e.key === 'ArrowRight') stepLb(1);
  if (e.key === 'i' || e.key === 'I') setInfo(!infoOpen);
});
let swipeX = null;                                   // swipe left/right on a phone
lbStage.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, { passive: true });
lbStage.addEventListener('touchend', e => {
  if (swipeX === null) return;
  const dx = e.changedTouches[0].clientX - swipeX;
  swipeX = null;
  if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- mobile menu ---------- */
$('menuToggle').addEventListener('click', e => {
  const open = nav.classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', open);
});

/* ---------- start ---------- */
$('yr').textContent = new Date().getFullYear();
buildNav();
measureSidebar();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureSidebar);
window.addEventListener('hashchange', route);
route();
requestAnimationFrame(frame);
</script>
</body>
</html>
