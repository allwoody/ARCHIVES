<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allwood Archives</title>
<meta name="description" content="A portfolio of selected work.">
<meta name="theme-color" content="#474a4f">
<link rel="icon" type="image/png" href="images/favicon.png">

<meta property="og:description" content="A portfolio of selected work.">
<meta name="twitter:card" content="summary">
<!-- Inter: a free typeface that closely matches the look of NB International, the font A24 uses -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<!--
  index.html is the CODE of the site. Your content (events, photos, About,
  Contact) lives in events.js, so you can replace this file with a newer
  version at any time without losing anything you typed.
-->
<style>
  :root {
    /* Iron gray palette: a mid charcoal background with soft off-white text. */
    --bg: #474a4f;        /* background: iron gray */
    --ink: #f1efea;       /* main text: warm off-white */
    --muted: #c9c7c1;     /* menu + small text */
    --tile: #383b3f;      /* boxes behind photos / placeholders / map water */
    --ph: #c9c7c1;        /* text on placeholder boxes */
    --line: #686b71;
    --panel: #585b61;     /* info window, popups, map land: the raised surface */
    --rgb-ink: 241, 239, 234;
    --rgb-bg: 71, 74, 79;
    --sidebar: 250px;
    /* typeface. NB International is A24's font (paid). If you own it and upload the font
       files, it is used automatically; otherwise Inter (free) is used. */
    --font: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --logo-width: 150px;  /* set from SETTINGS.logoWidth in events.js */
    --m-h: clamp(190px, 54vh, 620px);   /* height of the photos in the Home marquee */
    --m-gap: 18px;                      /* space between marquee photos */
    --gap: 10px;                        /* space between photos in a collection */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  input, textarea, select { font-family: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- sidebar ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--sidebar);
    padding: 36px 28px;
    overflow-x: hidden; overflow-y: auto;
    background-color: transparent;
    z-index: 20;
    contain: layout paint style;
    transition: width 0.2s cubic-bezier(0.2, 0.7, 0.2, 1), background-color 0.2s ease;
  }
  /* blur layer that covers the page (but not the sidebar) while the sidebar is open */
  .scrim {
    position: fixed; inset: 0; z-index: 19;
    background: rgba(40, 42, 46, 0.5);                 /* a plain dim, not a blur: blurring the live page every frame was the lag */
    opacity: 0; pointer-events: none; will-change: opacity;
    transition: opacity 0.2s ease;
  }
  /* On a computer the sidebar rests narrow and shows only the section headings.
     Hover it (or tab into it) and it widens, the sub-links drop down, and the page
     behind it blurs slightly. */
  @media (hover: hover) and (min-width: 721px) {
    :root { --sidebar: 160px; }
    /* keep the logo inside the narrow resting sidebar, centred on it, so its edge isn't cut off */
    .logo img { width: min(var(--logo-width), calc(var(--sidebar) - 12px)); margin-left: calc((var(--sidebar) - min(var(--logo-width), var(--sidebar) - 12px)) / 2 - 28px); }
    .sidebar { width: min(var(--sidebar-open, 250px), 70vw); clip-path: inset(0 calc(100% - var(--sidebar)) 0 0); transition: clip-path 0.2s cubic-bezier(0.2, 0.7, 0.2, 1), background-color 0.2s ease; }
    .sidebar:not(.closed):hover,
    .sidebar.navpeek:not(.closed),
    .sidebar:not(.closed):focus-within {
      clip-path: inset(0 0 0 0);
      background-color: var(--bg);
    }
    /* freeze the sliding dots while the menu is open so the browser has less to redraw */
    body:has(.sidebar:not(.closed):hover) #dotLayer, body:has(.sidebar.navpeek) #dotLayer { animation-play-state: paused; }
    .sidebar:not(.closed):hover ~ .scrim,
    .sidebar.navpeek:not(.closed) ~ .scrim,
    .sidebar:not(.closed):focus-within ~ .scrim { opacity: 1; }
  }
  @media (hover: hover) and (min-width: 721px) {
    .sidebar .nav { transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s; }
    body.nav-hidden .sidebar:not(.navpeek) { pointer-events: none; }
    body.nav-hidden .sidebar .logo { pointer-events: auto; }
    body.nav-hidden .sidebar:not(.navpeek):not(:hover) .nav { opacity: 0; transform: translateX(-14px); visibility: hidden; transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s 0.3s; }
  }
  .logo {
    display: block;
    font-size: 20px; line-height: 1.1; letter-spacing: 0.02em;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 44px;
  }
  .logo:hover { color: var(--ink); }
  .logo img { display: block; width: var(--logo-width); max-width: 100%; height: auto; }
  /* a gentle side-to-side turn so the logo has a little life (SETTINGS.logoSway in events.js; 0 = off) */
  .logo { perspective: 600px; }
  .logo img, .logo .logo-text {
    transform-origin: 50% 50%;
    animation: logo-sway 7s ease-in-out infinite;
    will-change: transform;
  }
  .logo .logo-text { transform-origin: 0 50%; }
  @keyframes logo-sway {
    0%, 100% { transform: rotateY(calc(var(--sway, 14deg) * -1)); }
    50%      { transform: rotateY(var(--sway, 14deg)); }
  }

  .nav { list-style: none; margin: 0; padding: 0; }
  .nav li { margin: 0 0 9px; white-space: nowrap; }
  .nav a {
    display: inline-block; vertical-align: top;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;   /* one straight line, never wraps */
    line-height: 1.4;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    transform-origin: left center;
    transition: color 0.15s, transform 0.15s ease;
  }
  .nav a:hover, .nav a.active { color: var(--ink); }
  @media (hover: hover) { .nav a:hover { transform: scale(1.08); } }   /* slight magnify on hover */

  /* section headers: Home, Projects, Info */
  .nav .sec { margin: 0 0 22px; }
  .nav .head {
    display: block;
    font-size: 15px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    outline: none;
  }
  .nav .head a { color: var(--ink); }
  .nav .head:focus-visible { text-decoration: underline; text-underline-offset: 4px; }

  /* the sub-links under each header */
  .nav .subs { display: grid; grid-template-rows: 1fr; }
  .nav .subs > ul { list-style: none; margin: 0; padding: 12px 0 0; min-height: 0; overflow: hidden; }
  .nav .subs li:last-child { margin-bottom: 0; }
  @media (hover: hover) and (min-width: 721px) {
    /* closed: only the headers show */
    .nav .subs {
      grid-template-rows: 0fr; opacity: 0; visibility: hidden;
      transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.7, 0.2, 1),
                  opacity 0.2s ease, visibility 0s linear 0.3s;
    }
    /* open: they drop down */
    .sidebar:not(.closed):hover .subs,
    .sidebar:not(.closed):focus-within .subs {
      grid-template-rows: 1fr; opacity: 1; visibility: visible;
      transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) 0.06s,
                  opacity 0.25s ease 0.1s, visibility 0s;
    }
  }

  .menu-toggle { display: none; }

  /* ---------- main ---------- */
  main {
    margin-left: var(--sidebar);
    min-height: 100vh;
    padding: 36px 0 0 8px;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .view { display: none; flex: 1; padding-right: 36px; }
  .view.on { display: block; }
  #view-home { padding-right: 0; }
  #view-home.on { display: flex; flex-direction: column; justify-content: center; gap: 22px; }

  /* Home only: the logo moves out of the sidebar and becomes a big centred header */
  .home-logo {
    display: block; align-self: center; text-decoration: none; color: var(--ink);
    --hl: clamp(300px, 34vw, 540px);
    width: var(--hl); aspect-ratio: 16 / 5.6; overflow: hidden; perspective: 700px;
    filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.3));   /* trims the empty margin round the logo; a steady soft glow */
  }
  /* the flicker is in the logo itself, not the glow: it dips and jumps back like a tired neon tube */
  @keyframes logo-flick {
    0%, 100% { opacity: 1; }
    7% { opacity: 0.55; } 8% { opacity: 1; } 9% { opacity: 0.4; } 11% { opacity: 1; }
    71% { opacity: 0.6; } 72% { opacity: 1; } 74% { opacity: 0.5; } 76% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .home-logo img { animation: none; } }
  .home-logo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%;
    transform-origin: 50% 50%; animation: logo-sway 7s ease-in-out infinite, logo-flick 6s steps(1, end) infinite; }
  .home-logo .logo-text { display: block; text-align: center; font-size: 34px; letter-spacing: 0.04em; }
  body:not(.is-home) .home-logo { display: none; }
  body.is-home { --m-h: clamp(160px, calc(100vh - 500px), 600px); }

  /* ---------- home marquee (drag it, or let it drift) ---------- */
  .marquee {
    width: 100%;
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;          /* sideways = drag the row, up/down = scroll the page */
    user-select: none; -webkit-user-select: none;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
  }
  .marquee.dragging { cursor: grabbing; }
  .marquee.dragging a { pointer-events: none; }
  .track {
    display: flex;
    width: max-content;
    will-change: transform;
  }
  .group { display: flex; flex-shrink: 0; }
  .m-item {
    display: block;
    flex-shrink: 0;
    margin-right: var(--m-gap);
    width: calc(var(--m-h) * 16 / 9);
    text-decoration: none;
  }
  .m-img {
    position: relative;
    display: block;
    width: 100%;
    height: var(--m-h);
    background: var(--tile);
    overflow: hidden;
  }
  .m-img img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
  .m-img .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em; font-size: 12px; text-transform: uppercase;
  }
  .m-cap {
    display: block; line-height: 1.55;
    margin-top: 12px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px;
    color: var(--ink);
  }
  .m-cap span { color: var(--muted); }
  .m-cap .dot { margin: 0 9px; color: var(--muted); opacity: 0.8; }
  .m-item:hover .m-cap span { color: var(--ink); }

  /* ---------- page headings (collection + globe) ---------- */
  .collection-head { margin: 0 0 26px; }
  #view-collection { padding-bottom: 48px; }
  #collTitle { font-size: clamp(30px, 4.6vw, 64px); font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; text-transform: none; margin-bottom: 4px; }
  .ch-score { margin: 2px 0 8px; font-size: clamp(14px, 1.5vw, 20px); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .ch-score:empty { display: none; }
  .ch-score + .ch-meta { font-size: 12px; }
  #collTitle + .ch-meta { font-size: 12px; }
  /* event titles: written on in chalk, whiteboard-marker handwriting, with a little hand-drawn wiggle */
  #collTitle.chalk { font-family: "Permanent Marker", "Segoe Print", "Bradley Hand", cursive; font-weight: 400; letter-spacing: 0.01em; color: #f6f3ea;
    filter: url(#chalkRough); text-shadow: 0 0 6px rgba(255, 255, 255, 0.18); }
  #collTitle .cw { display: inline-block; white-space: pre; }
  #collTitle .cl { display: inline-block; clip-path: inset(-10% 100% -10% -4%); will-change: transform; }
  #collTitle.go .cl { animation: chalkWrite 0.22s cubic-bezier(0.3, 0.6, 0.4, 1) forwards var(--d, 0s), chalkWiggle 0.8s steps(1, end) infinite var(--w, 0s); }
  @keyframes chalkWrite { from { clip-path: inset(-10% 100% -10% -4%); opacity: 0.4; } to { clip-path: inset(-10% -6% -10% -4%); opacity: 1; } }
  @keyframes chalkWiggle {
    0%   { transform: translate(0, 0) rotate(var(--r, 0deg)); }
    33%  { transform: translate(0.7px, -0.9px) rotate(calc(var(--r, 0deg) + 0.9deg)); }
    66%  { transform: translate(-0.6px, 0.7px) rotate(calc(var(--r, 0deg) - 0.8deg)); }
  }
  @media (prefers-reduced-motion: reduce) { #collTitle.go .cl { animation: none; clip-path: none; } }
  .skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .skip:focus { top: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ch-title {
    margin: 0; font-weight: 400;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px;
  }
  .ch-meta {
    margin-top: 6px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
  }
  .ch-desc {
    max-width: 560px;
    margin: 16px 0 0;
    font-size: 14px; line-height: 1.6;
    color: var(--ink);
  }

  /* photo layouts. Pick one per collection with  layout: "grid" | "square" | "wide" | "masonry"  */
  .grid {
    display: grid;
    gap: var(--gap);
    grid-template-columns: repeat(var(--cols, 3), 1fr);
  }
  .layout-grid   { --cols: 3; --ratio: 3 / 2; }   /* 3 across, every photo cropped to the same shape */
  .layout-square { --cols: 4; --ratio: 1 / 1; }   /* 4 across, square tiles */
  .layout-wide   { --cols: 2; --ratio: 16 / 9; }  /* 2 across, big cinematic tiles */
  .layout-masonry {                               /* 3 columns, photos keep their own shape (no cropping) */
    display: flex; gap: var(--gap); align-items: flex-start;
    column-count: 3;
    column-gap: var(--gap);
  }
  .layout-masonry .mcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
  .layout-masonry .tile { break-inside: avoid; }
  .layout-masonry .tile img { height: auto; }
  .layout-masonry .tile.r0 { aspect-ratio: 3 / 2; }
  .layout-masonry .tile.r1 { aspect-ratio: 2 / 3; }
  .layout-masonry .tile.r2 { aspect-ratio: 1 / 1; }
  .layout-masonry .tile.r3 { aspect-ratio: 4 / 5; }

  .tile {
    position: relative;
    display: block; width: 100%;
    aspect-ratio: var(--ratio, auto);
    background: var(--tile);
    overflow: hidden;
    cursor: zoom-in;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em; font-size: 12px;
  }

  /* ---------- map ---------- */
  #view-globe { padding-right: 0; }
  .globe-area { padding-top: 4px; }
  .globe-wrap {
    position: relative; width: 100%;
    overflow: hidden;
    background: transparent;                      /* no backing: the icebergs float over the dots */
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .globe-wrap canvas { display: block; }
  .mhud, .minfo { text-shadow: 0 1px 8px rgba(0,0,0,0.85); }
  .mhud { position: absolute; left: 0; top: 4px; z-index: 4; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .mhud .mc { color: var(--muted); padding: 5px 2px; transition: color 0.15s, transform 0.15s; }
  .mhud button.mc:hover { color: var(--ink); }
  .mhud .mc.on { color: var(--ink); }
  .mhud .mc.back { width: 28px; height: 28px; margin-right: 6px; border: 1px solid var(--line); border-radius: 50%; padding: 0; font-size: 15px; line-height: 1; }
  .mhud .mc.back:hover { transform: translateX(-2px); border-color: var(--muted); }
  .mhud .sep { color: var(--muted); opacity: 0.6; }
  .minfo { position: absolute; left: 0; top: 40px; z-index: 4; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
  .minfo .ml { display: block; }
  .minfo .ml:first-child { color: var(--ink); }
  .mtip { position: absolute; z-index: 6; pointer-events: none; padding: 7px 11px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; box-shadow: 0 8px 22px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 2px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .mtip[hidden] { display: none; }
  .mtip span { color: var(--muted); font-size: 11px; }
  .mtip .lk { display: inline-flex; align-items: center; gap: 6px; }
  .lockcard { position: absolute; left: 50%; top: 46%; z-index: 7; width: min(320px, 86%); transform: translate(-50%, -46%) scale(0.94); opacity: 0;
    text-align: center; padding: 24px 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 44px rgba(0,0,0,0.5);
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .lockcard[hidden] { display: none; }
  .lockcard.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .lockcard .lk { color: var(--ink); display: flex; justify-content: center; margin-bottom: 10px; }
  .lockcard .lt { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .lockcard .lm { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .sbadge { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%;
    background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg); box-shadow: 0 0 0 1px rgba(241,239,234,0.45), 0 6px 14px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; cursor: pointer; transition: opacity 0.3s ease, box-shadow 0.15s; z-index: 3; }
  .sbadge.on { opacity: 1; pointer-events: auto; }
  .sbadge:hover { box-shadow: 0 0 0 6px rgba(241,239,234,0.25), 0 6px 14px rgba(0,0,0,0.4); }
  .pins { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .pin {
    position: absolute; left: 0; top: 0;
    width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(241, 239, 234, 0.45);
    display: flex; align-items: center; justify-content: center;
    color: var(--bg); font-size: 9px; font-weight: 700; line-height: 1;
    opacity: 0; pointer-events: none;
    cursor: pointer;
    transition: opacity 0.2s ease, box-shadow 0.15s ease;
  }
  .pin.multi { width: 22px; height: 22px; margin: -11px 0 0 -11px; font-size: 11px; }
  .pin::after {
    content: ""; position: absolute; inset: -6px;
    border-radius: 50%; border: 1px solid var(--ink);
    animation: pin-pulse 2.4s ease-out infinite;
    pointer-events: none;
  }
  @keyframes pin-pulse {
    from { transform: scale(0.55); opacity: 0.55; }
    to   { transform: scale(1.5);  opacity: 0; }
  }
  .pin:hover, .pin.on, .pin:focus-visible { box-shadow: 0 0 0 5px rgba(241, 239, 234, 0.22); outline: none; }
  .globe-hint {
    margin: 16px 0 0; padding-right: 36px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
  }
  .globe-fallback { max-width: 560px; font-size: 14px; line-height: 1.6; }
  .globe-fallback h3 {
    margin: 22px 0 6px; font-size: 12px; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  }
  .globe-fallback a { display: block; text-decoration: underline; text-underline-offset: 3px; }

  /* popup that appears when you hover a pin */
  .gpop {
    position: fixed; z-index: 30;
    width: min(320px, calc(100vw - 24px));
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    font-size: 12px; line-height: 1.4;
  }
  .gpop[hidden] { display: none; }
  .gp-place {
    padding: 12px 14px 10px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
  }
  .gp-list { border-top: 1px solid var(--line); }
  .gp-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
  }
  .gp-item .d { font-size: 11px; white-space: nowrap; }
  .gp-item.on, .gp-item:hover { color: var(--ink); background: rgba(241, 239, 234, 0.07); }
  .gp-mq { overflow: hidden; }
  .gp-track {
    display: flex; width: max-content;
    animation: gp-scroll 20s linear infinite;
  }
  .gp-group { display: flex; flex-shrink: 0; }
  @keyframes gp-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .gp-thumb {
    position: relative; display: block;
    flex: 0 0 120px; width: 120px; height: 80px;
    margin-right: 6px;
    background: var(--tile);
    overflow: hidden;
  }
  .gp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gp-thumb .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em; font-size: 11px;
  }
  .gp-empty { padding: 14px; color: var(--muted); }
  .gp-foot {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 14px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
  .gp-foot a { color: var(--ink); text-decoration: none; }
  .gp-foot a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- index page: a 50 / 50 split that fills the whole screen ---------- */
  #view-index { padding-right: 0; }
  #view-index.on { display: block; }
  main:has(#view-index.on) { padding-bottom: 0; }
  main:has(#view-index.on) footer { display: none; }
  .ix-split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 36px); min-height: 0; }
  .ix-left { min-width: 0; min-height: 0; overflow-y: auto; padding: 0 36px 40px 0; scrollbar-width: thin; }
  .ix-right {                                   /* runs from the top edge to the bottom edge of the screen */
    margin-top: -36px; height: 100vh;
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 36px 36px 28px;
  }
  .ix-totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 0 0 30px; border-top: 1px solid var(--ink); }
  .ix-stat { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); }
  .ix-stat b { display: block; font-size: clamp(26px, 3.2vw, 46px); font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .ix-stat span { display: block; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted); }
  .index { max-width: none; }
  .ix-row {
    display: grid;
    grid-template-columns: 1.6fr 1fr 1.2fr 56px;
    gap: 16px;
    align-items: baseline;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px;
  }
  .ix-head { color: var(--muted); font-size: 11px; padding-top: 0; }
  a.ix-row span:first-child { font-weight: 700; }
  a.ix-row span:nth-child(n+2) { color: var(--muted); }
  a.ix-row:hover span { color: var(--ink); }
  .ix-row span:last-child { text-align: right; }

  /* ---------- search (right half of the Index page) ---------- */
  .sx-bar { flex: none; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--ink); }
  .sx-bar input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: none; border-radius: 0;
    padding: 12px 0;
    font: inherit; font-size: 16px; color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  .sx-bar input::placeholder { color: var(--muted); }
  .sx-bar input::-webkit-search-cancel-button { display: none; }
  .sx-clear { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted); }
  .sx-clear:hover { color: var(--ink); }
  .sx-tools {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
    margin: 20px 0 14px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted);
  }
  .sx-mode button {
    padding: 2px 7px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted);
  }
  .sx-mode button:hover { color: var(--ink); }
  .sx-mode button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  .sx-tags { flex: 1; min-height: 0; overflow-y: auto; align-content: flex-start; scrollbar-width: thin; padding: 2px 2px 8px 0; display: flex; flex-wrap: wrap; gap: 9px; }
  .sx-chip {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink);
    transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
  }
  .sx-chip span { font-size: 10px; color: var(--muted); }
  .sx-chip:hover { border-color: var(--ink); }
  .sx-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .sx-chip[aria-pressed="true"] span { color: var(--bg); opacity: 0.7; }
  .sx-chip.zero { opacity: 0.3; cursor: default; }
  .sx-chip.zero:hover { border-color: var(--line); }
  .sx-status {
    flex: none; margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted);
  }
  .sx-note { grid-column: 1 / -1; margin: 0; max-width: 560px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .res {
    display: grid; gap: 22px var(--gap);
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    --ratio: 3 / 2;
  }
  .res[hidden], .index[hidden] { display: none; }
  .res-cap { margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); }
  .res-cap span { color: var(--muted); margin-left: 6px; }

  /* tag chips on event pages + in the viewer's info window */
  .ch-tags, .i-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .ch-tags { margin-top: 16px; }
  .ch-tags:empty { display: none; }

  /* event page tags: one drifting line, with an arrow on the left that opens the full list */
  .tg-bar { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; }
  .tg-bar.none { display: none; }
  .tg-arrow {
    flex: none; width: 28px; height: 28px; margin-top: 1px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 50%; color: var(--muted); cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.2s ease;
  }
  .tg-arrow svg { display: block; transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tg-arrow:hover, .tg-arrow:focus-visible { color: var(--ink); border-color: var(--ink); outline: none; }
  .tg-arrow:hover svg { transform: translateY(2px); }
  .tg-arrow:active { transform: scale(0.88); }
  .tg-bar.open .tg-arrow { color: var(--ink); border-color: var(--ink); }
  .tg-bar.open .tg-arrow svg { transform: rotate(180deg); }
  .tg-bar.open .tg-arrow:hover svg { transform: rotate(180deg) translateY(2px); }
  .tg-view { flex: 1; min-width: 0; overflow: hidden; }
  .tg-bar:not(.open) .tg-view {
    -webkit-mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
  }
  .tg-track { display: flex; width: max-content; }
  .tg-set { display: flex; gap: 8px; padding-right: 8px; flex: none; }
  .tg-bar:not(.open):not(.still) .tg-track { animation: tg-scroll var(--tg-dur, 60s) linear infinite; }
  .tg-bar:not(.open) .tg-track:hover { animation-play-state: paused; }       /* resting on the tags just holds them still */
  @keyframes tg-scroll { to { transform: translateX(-50%); } }
  .tg-bar.still .tg-set + .tg-set, .tg-bar.open .tg-set + .tg-set { display: none; }
  .tg-bar.open .tg-track { width: auto; }
  .tg-bar.open .tg-set { flex: 1 1 auto; min-width: 0; flex-wrap: wrap; padding-right: 0; animation: tg-open 0.35s ease both; }
  @keyframes tg-open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .i-tags { gap: 6px; }
  @media (pointer: coarse) { .sx-chip, .ch-tag, .i-tag { min-height: 44px; align-items: center; display: inline-flex; } .nav a { padding-top: 10px; padding-bottom: 10px; } }
  .ch-tag, .i-tag {
    padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 999px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    text-decoration: none; color: var(--muted);
    transition: color 0.15s, border-color 0.15s;
  }
  .ch-tag:hover, .i-tag:hover { color: var(--ink); border-color: var(--ink); }

  /* ---------- text pages ---------- */
  .ix-stat.bump b { animation: statbump 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes statbump { 0% { transform: translateY(6px); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
  .ix-totals.filtered .ix-stat b { color: var(--ink); }
  .text-page { max-width: 560px; padding-top: 4px; font-size: 15px; line-height: 1.6; }
  .text-page h1 {
    font-size: 13px; font-weight: normal; text-transform: uppercase;
    letter-spacing: 0.06em; margin: 0 0 22px;
  }
  .text-page p { margin: 0 0 1.1em; }
  .text-page a { text-decoration: underline; text-underline-offset: 3px; }

  footer {
    padding: 56px 36px 28px 0;
    font-size: 11px; color: var(--muted);
  }

  /* ---------- hover preview (desktop): photo goes fullscreen while you rest on it ---------- */
  .peek {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.18s ease, visibility 0.18s;
    pointer-events: none;            /* so the photo underneath keeps the hover */
  }
  .peek.on { opacity: 1; visibility: visible; }
  .peek img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .peek .ph-big {
    width: min(100%, 1100px); aspect-ratio: 16 / 9;
    background: var(--tile);
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em;
  }
  #peekStage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* small camera-settings popup, bottom right of the enlarged photo */
  .peek-info {
    position: absolute; right: 28px; bottom: 28px;
    max-width: 340px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 12px; line-height: 1.5;
  }
  .peek-info:empty { display: none; }
  .peek-info .l1 { color: var(--ink); }
  .peek-info .l2 { color: var(--muted); margin-top: 2px; letter-spacing: 0.02em; }

  /* ---------- fullscreen viewer + info window ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(71, 74, 79, 0.98);
    display: none;
  }
  .lb.on { display: flex; flex-direction: row; }
  .lb-main {
    position: relative;
    flex: 1; min-width: 0;
    padding: 56px 72px;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-stage .ph-big {
    width: min(100%, 1100px); aspect-ratio: 16 / 9;
    background: var(--tile);
    display: flex; align-items: center; justify-content: center;
    color: var(--ph); letter-spacing: 0.12em;
  }
  .lb button.ctl2 {
    position: absolute; z-index: 2;
    font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }
  .lb button.ctl2:hover, .lb button.ctl2[aria-pressed="true"] { color: var(--ink); }
  .lb .close   { top: 22px; right: 28px; }
  .lb .infobtn { top: 22px; right: 92px; }
  .lb .prev { left: 22px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 22px; top: 50%; transform: translateY(-50%); }
  .lb .count { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); }

  .lb-info {
    display: none;
    width: 290px; flex-shrink: 0;
    margin: 64px 28px 28px 0;
    padding: 20px;
    align-self: flex-start;
    max-height: calc(100vh - 92px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 12px; line-height: 1.5;
  }
  .lb.info-on .lb-info { display: block; }
  .i-sec { margin-bottom: 20px; }
  .i-sec:last-child { margin-bottom: 0; }
  .i-title { text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .i-head { text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .i-row { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .i-row span:first-child { color: var(--muted); flex-shrink: 0; }
  .i-row span:last-child { text-align: right; }
  .i-desc { margin: 12px 0 0; }
  .i-sec .i-desc:first-child { margin-top: 0; }

  /* ---------- tablet / mobile ---------- */
  @media (max-width: 1000px) {
    .layout-grid   { --cols: 2; }
    .layout-square { --cols: 3; }
    .layout-masonry { column-count: 2; }
  }
  @media (max-width: 900px) {
    .lb.on { flex-direction: column; }
    .lb-main { padding: 56px 12px 8px; }
    .lb-info { width: auto; margin: 0 12px 12px; max-height: 38vh; align-self: stretch; }
    .lb .prev { left: 6px; } .lb .next { right: 6px; }
  }
  @media (max-width: 900px) {                      /* phones + small tablets: the Index halves stack */
    .ix-split { display: block; height: auto; }
    .ix-left { overflow: visible; padding: 0 12px 24px 0; }
    .ix-right { margin: 0 -12px 0 0; height: auto; min-height: 60vh; padding: 24px 12px 28px 16px; border-left: 0; border-top: 1px solid var(--line); }
    .sx-tags { overflow: visible; }
    main:has(#view-index.on) footer { display: block; }
    .ix-totals { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .sidebar {
      position: sticky; top: 0; bottom: auto; width: 100%;
      padding: 16px 18px; overflow: visible;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .logo { margin: 0; }
    body.is-home main { padding: 12px 0 0; }
    body.is-home { --m-h: clamp(150px, 34vh, 300px); }
    .home-logo { --hl: min(78vw, 420px); }
    .logo img { width: min(var(--logo-width), 120px); }
    .menu-toggle { display: block; min-height: 44px; min-width: 44px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); }
    .nav { display: none; width: 100%; padding-top: 22px; }
    .nav.open { display: block; }
    main { margin-left: 0; padding: 12px 0 0 12px; }
    .view { padding-right: 12px; }
    footer { padding-right: 12px; }
    .layout-grid, .layout-wide { --cols: 1; }
    .ix-row { grid-template-columns: 1fr auto; }
    .ix-row span:nth-child(3), .ix-row span:nth-child(4) { display: none; }
    .layout-square { --cols: 2; }
    .layout-masonry { column-count: 2; }
    :root { --m-h: clamp(160px, 38vh, 320px); --m-gap: 12px; --gap: 8px; }
  }


  /* ---------- favorites: one glossy magazine per project ---------- */
  #view-favorites { padding-right: 0; }
  #view-favorites.on { display: flex; flex-direction: column; }
  /* centre the magazines on the whole screen (the page area is pushed right by the menu) */
  @media (min-width: 721px) { .mg-wrap, .mag-viewer { position: relative; left: calc((var(--sidebar) + 8px) / -2); } }
  .mg-top { display: flex; justify-content: center; align-items: center; gap: 14px; min-height: 36px; margin: 0 0 6px; }
  .pill { display: inline-flex; align-items: center; gap: 9px; min-height: 36px; padding: 0 20px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(71, 74, 79, 0.9); color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    transition: border-color 0.2s, color 0.2s, transform 0.18s ease, background 0.2s; }
  .pill:hover, .pill:focus-visible { border-color: var(--muted); color: var(--ink); outline: none; }
  .pill:active { transform: scale(0.96); }
  .mv-title { color: var(--ink); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .mg-info, .mg-stage { transition: opacity 0.35s ease; }
  .mg-wrap.going .mg-info, .mg-wrap.going .mg-nav, .mg-wrap.going .mg-top { opacity: 0; transition: opacity 0.25s ease; }
  @keyframes mvIn { from { opacity: 0; transform: translateY(14px) scale(0.9); } to { opacity: 1; transform: none; } }
  @keyframes mvOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(10px) scale(0.92); } }
    .mag-viewer.pre { visibility: hidden; }
  @keyframes mvFade { from { opacity: 0; } to { opacity: 1; } }
  .mag-viewer.fadein { animation: mvFade 0.3s ease both; }
  .pg .shd { position: absolute; inset: 0; z-index: 9; background: #000; opacity: 0; pointer-events: none; }
  .mag-head { display: flex; align-items: baseline; gap: 16px; margin: 0 0 18px; }
  .mag-head h1 { margin: 0; font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .mag-head span { color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .mg-wrap { --ch: clamp(300px, calc(100vh - 320px), 600px); --cw: calc(var(--ch) * 0.74); position: relative; width: 100%; max-width: 1200px; margin: auto; padding: 0 36px; }
  .mg-wrap[hidden] { display: none; }
  .mg-stage { position: relative; height: calc(var(--ch) + 70px); perspective: 1500px; perspective-origin: 50% 40%; touch-action: pan-y; }
  .mg-card { position: absolute; left: 50%; top: 24px; width: var(--cw); height: var(--ch); margin-left: calc(var(--cw) / -2); display: block; text-align: left; color: var(--ink);
    transition: transform 0.7s cubic-bezier(0.22, 0.8, 0.2, 1), opacity 0.45s ease, scale 0.3s ease; will-change: transform; transform-style: preserve-3d; cursor: pointer; scale: 1; }
  @media (hover: hover) { .mg-card:hover { scale: 1.08; z-index: 250 !important; } }
  .mg-cover { position: absolute; inset: 0; display: block; border-radius: 3px 7px 7px 3px; overflow: hidden; background: #1b1c1f;
    box-shadow: 0 18px 30px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.4); }
  .mg-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
  .mg-cover::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(to right, rgba(0,0,0,0.45), rgba(0,0,0,0.1) 5%, rgba(255,255,255,0.10) 6.5%, transparent 12%); }
  .mg-cover::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,0.16), transparent 42%, rgba(0,0,0,0.10)); }
  .mg-cover .veil { position: absolute; inset: 0; z-index: 1; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 36%, transparent 55%, rgba(0,0,0,0.75)); }
  .mg-cover .mast { position: absolute; left: 16px; top: 14px; z-index: 2; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
  .mg-cover .ttl { position: absolute; left: 16px; right: 12px; bottom: 16px; z-index: 2; font-size: clamp(13px, calc(var(--cw) * 0.055), 19px); line-height: 1.25; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .mg-cover .ttl small { display: block; margin-top: 6px; font-size: 10px; font-weight: 400; letter-spacing: 0.14em; opacity: 0.85; }
  .mg-card .dim { position: absolute; inset: 0; z-index: 5; background: #000; opacity: 0; border-radius: 3px 7px 7px 3px; transition: opacity 0.5s ease; pointer-events: none; }
  .mg-card.side .dim { opacity: 0.38; }
  @media (hover: hover) { .mg-card.side:hover .dim { opacity: 0.16; } }
  .mg-nav { position: absolute; top: calc(var(--ch) / 2 + 66px); z-index: 300; margin-top: -23px; }
  .mg-prev { left: 36px; } .mg-next { right: 36px; }
  .mg-info { text-align: center; margin-top: 2px; min-height: 48px; }
  .mg-info b { display: block; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
  .mg-info span { display: block; margin-top: 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .mag-viewer[hidden] { display: none; }
  .mag-viewer:not([hidden]) { margin: auto; width: 100%; }
  .mv-bar-unused { display: flex; align-items: center; gap: 16px; margin: -6px 0 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .mv-bar button { color: var(--muted); display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; transition: color 0.15s, transform 0.15s; }
  .mv-bar button:hover { color: var(--ink); transform: translateX(-2px); }
  .mv-bar span { color: var(--ink); }
  .mag-stage { position: relative; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 8px 0 0; }
  .mag {
    --ph: clamp(280px, min(calc(100vh - 250px), calc((100vw - var(--sidebar-open, 240px) - 190px) / 1.5)), 760px);
    --pw: calc(var(--ph) * 0.74);
    position: relative; width: calc(var(--pw) * 2); height: var(--ph); flex: none;
    perspective: 2400px; perspective-origin: 50% 40%;

      (c.date ? `<span class="dot">\u2022</span><span>${esc(c.date)}</span>` : '') + `</span>`;
  return a;
}

function wrapOffset() {
  if (groupW) offset = ((offset % groupW) + groupW) % groupW;
}

function buildMarquee() {
  track.innerHTML = '';
  if (!COLLECTIONS.length) return;

  const group = document.createElement('div');
  group.className = 'group';
  COLLECTIONS.forEach(c => group.appendChild(makeItem(c, false)));
  track.appendChild(group);

  const setW = group.offsetWidth;            // needs the Home page to be visible
  if (!setW) return;

  const reps = Math.max(1, Math.ceil(marquee.clientWidth / setW));
  for (let r = 1; r < reps; r++) {
    COLLECTIONS.forEach(c => group.appendChild(makeItem(c, true)));

/* ---- the United States view: Alaska and Hawaii tucked in below the mainland, everything else softened ---- */

/* ---- heads-up text: breadcrumbs, counts, hint ---- */
function updateHud() {

  if (g.level === 'country' || g.level === 'state') g.crumbs.push({ label: g.country.name.replace('United States of America', 'United States'), fn: () => setLevel('country', g.country) });
  if (g.level === 'state') g.crumbs.push({ label: g.state.name });

    g.crumbs.map((c, i) => (i ? '<span class="sep">›</span>' : '') +

  let info = '', hint = '';

mhud.addEventListener('click', e => {

/* ---- tooltip + lock card ---- */
function showTip(html, locked) {
  mtip.innerHTML = html; mtip.classList.toggle('locked', !!locked); mtip.hidden = false;
  const pad8 = 10, w = mtip.offsetWidth, h = mtip.offsetHeight;
  mtip.style.left = clamp(g.mx + 16, pad8, g.w - w - pad8) + 'px';
  mtip.style.top = clamp(g.my + 18, pad8, g.h - h - pad8) + 'px';
}
function hideLock() { clearTimeout(g.lockTimer); lockCard.hidden = true; lockCard.classList.remove('on'); }
function showLock(title, msg) {
  hideLock();
  lockCard.innerHTML = `<div class="lk">${LOCK_SVG.replace('width="14" height="14"', 'width="34" height="34"')}</div><div class="lt">${esc(title)}</div><div class="lm">${esc(msg)}</div>`;

/* ---- what is under the cursor ---- */
const scrToWorld = (x, y) => [(x - g.w / 2) / g.cam.z + g.cam.cx, (y - g.h / 2) / g.cam.z + g.cam.cy];
function driftOf(ct, t, k) {
  return [0, 0];                                                 // the continents sit still
  if (reduceMotion || k <= 0) return [0, 0];
  const A = 3.2 / g.z0 * (0.8 + (ct.bb.x1 - ct.bb.x0) / WW * 0.8);        // bigger icebergs move a little more, but never enough to touch a neighbour
  const dx = A * (Math.sin(t * ct.fq[0] + ct.ph[0]) + 0.45 * Math.sin(t * ct.fq[0] * 2.3 + ct.ph[1])) / 1.45;
  const dy = A * 0.8 * (Math.sin(t * ct.fq[1] + ct.ph[2]) + 0.4 * Math.sin(t * ct.fq[1] * 2.1 + ct.ph[0])) / 1.4;
  return [dx * k, dy * k];
}
function shakeOf(ct, now) {
  if (!g.shake || g.shake.ct !== ct) return 0;
  const t = (now - g.shake.t0) / 1000;
  if (t > 0.8) { g.shake = null; return 0; }
  return Math.sin(t * 38) * Math.exp(-t * 6) * 4 / g.z0;
}
function pickHover(now) {
  g.hover = null; g.hoverKind = '';
  if (!g.inside || !g.ready || g.down && g.down.moved) return;
  const [x, y] = scrToWorld(g.mx, g.my);
  if (g.level === 'world') {
    const t = now / 1000, depth = 15 / g.z0;
    for (let i = g.conts.length - 1; i >= 0; i--) {
      const ct = g.conts[i], [dx, dy] = driftOf(ct, t, 1);
      const px = x - dx, py = y - dy;
      if (!inBB({ x0: ct.sb.x0, x1: ct.sb.x1, y0: ct.sb.y0, y1: ct.sb.y1 + depth }, px, py)) continue;
      if (hitCtx.isPointInPath(ct.spath, px, py)) { g.hover = ct; g.hoverKind = 'cont'; return; }
    }
    for (let i = g.conts.length - 1; i >= 0; i--) {                      // then the sides of an iceberg
      const ct = g.conts[i], [dx, dy] = driftOf(ct, t, 1), px = x - dx, py = y - dy;
      if (inBB({ x0: ct.sb.x0, x1: ct.sb.x1, y0: ct.sb.y0, y1: ct.sb.y1 + depth }, px, py) && hitCtx.isPointInPath(ct.spath, px, py - depth * 0.6)) { g.hover = ct; g.hoverKind = 'cont'; return; }
    }
  } else if (g.level === 'cont') {
    const co = g.cont.countries.find(c => isIn(c, x, y));
    if (co) { g.hover = co; g.hoverKind = 'country'; }
  } else if (g.level === 'country' && g.country.hasStates) {
    const st = g.states.find(s => !s.terr && (g.usMode && s.ins ? (inBB(s.ins.tbb, x, y) && hitCtx.isPointInPath(s.ins.tpath, x, y)) : isIn(s, x, y)));
    if (st) { g.hover = st; g.hoverKind = 'state'; }
  }
}
function updateHoverUi() {
  const h = g.hover;
  let cur = '';
  if (!h) { mtip.hidden = true; }
  else if (g.hoverKind === 'cont') {
    showTip(`<b>${esc(h.name)}</b>` + (h.events ? `<span>${plural(h.events, 'event')}</span>` : `<span class="lk">${LOCK_SVG} No projects yet</span>`), !h.events);
    cur = 'pointer';
  } else {
    const name = h.name.replace('United States of America', 'United States');
    showTip(`<b>${esc(name)}</b>` + (h.events ? `<span>${plural(h.events, 'event')}</span>` : ''), false);
    cur = (h.events ? 'pointer' : '');
  }
  gwrap.style.cursor = cur;
}

/* ---- sizing ---- */
function sizeGlobe() {
  const area = $('globeArea');
  if (!area.clientWidth) return;
  const top = gwrap.getBoundingClientRect().top;
  const h = Math.round(clamp(window.innerHeight - top - 64, 320, 900));
  const w = area.clientWidth;
  if (w === g.w && h === g.h && g.ready && g.conts[0] && g.conts[0].spr) return;
  g.w = w; g.h = h; g.dpr = Math.min(2, window.devicePixelRatio || 1);
  const PAD = 46;
  g.z0 = Math.max(0.05, Math.min((w - 2 * PAD) / (g.wx1 - g.wx0), (h - 2 * PAD) / WH));
  gwrap.style.height = h + 'px';
  gcanvas.width = Math.round(w * g.dpr); gcanvas.height = Math.round(h * g.dpr);
  gcanvas.style.width = w + 'px'; gcanvas.style.height = h + 'px';
  if (!g.ready) return;
  g.conts.forEach(ct => { ct.coarse = null; }); g.usC = null;
  buildSprites();
  if (g.cont) { ensureCoarse(g.cont); g.zc = Math.max(fitRect(g.cont.bb, 0.84).z, g.z0 * 1.35); }
  g.cam = Object.assign({}, targetFor()); g.tw = null; g.sharp = null; g.needSharp = true;
}

/* ---- every frame ---- */
function globeStep() {
  if (!g.ready || !g.w) return;
  const now = performance.now(), c = gctx;
  if (g.tw) {                                           // the dive
    const p = clamp((now - g.tw.t0) / g.tw.d, 0, 1), e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const a = g.tw.a, b = g.tw.b;
    g.cam.cx = a.cx + (b.cx - a.cx) * e; g.cam.cy = a.cy + (b.cy - a.cy) * e; g.cam.z = a.z * Math.pow(b.z / a.z, e);
    if (p >= 1) { g.cam = { cx: b.cx, cy: b.cy, z: b.z }; g.tw = null; g.needSharp = true; if (g.level === 'world') { g.cont = null; updateBadges(); } }
  }
  pickHover(now);
  g.conts.forEach(ct => {                              // glow eases in and out
    const want = (g.hoverKind === 'cont' && g.hover === ct) ? 1 : 0;
    ct.hv += (want - ct.hv) * Math.min(1, 0.2);
    if (Math.abs(want - ct.hv) < 0.01) ct.hv = want;
  });
  updateHoverUi();
  const z = g.cam.z, w = g.w, h = g.h, d = g.dpr, sel = g.cont;
  const fz = sel ? clamp(Math.log(z / g.z0) / Math.log(g.zc / g.z0), 0, 1.2) : 0;
  c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
  const t = now / 1000;
  [false, true].forEach(glowPass => g.conts.forEach(ct => {                // every continent first, then the glows on top, so nothing jumps in front of a neighbour
    if (glowPass && ct.hv <= 0.01) return;
    const a = sel ? (ct === sel ? 1 - ss(0.5, 0.92, fz) : 1 - ss(0, 0.4, fz)) : 1;
    if (a <= 0.01 || !ct.spr) return;
    const k = sel ? (ct === sel ? 1 - ss(0, 0.5, fz) : 1) : 1;
    const [dx, dy] = driftOf(ct, t, k), sx = shakeOf(ct, now);
    const sp = ct.spr, r = z / sp.S;
    const x = (ct.sb.x0 - g.cam.cx + dx + sx) * z + w / 2 - sp.pad * r;
    const y = (ct.sb.y0 - g.cam.cy + dy) * z + h / 2 - sp.pad * r;
    if (!glowPass) { c.globalAlpha = a; c.drawImage(sp.cv, x, y, sp.cv.width * r, sp.cv.height * r); }
    else { c.globalAlpha = a * ct.hv; c.drawImage(sp.hv, x, y, sp.hv.width * r, sp.hv.height * r); }
  }));
  c.globalAlpha = 1;
  if (sel) {
    const da = ss(0.35, 0.85, fz);
    if (da > 0.01) {
      if (g.needSharp && !g.tw && da > 0.98) renderSharp();
      const wantUS = g.usMode ? 1 : 0;
      g.us += (wantUS - g.us) * 0.12; if (Math.abs(wantUS - g.us) < 0.01) g.us = wantUS;
      const putBitmap = (co, a) => { const r = co.r; c.globalAlpha = a; c.drawImage(co.cv, (r.x0 - g.cam.cx) * z + w / 2, (r.y0 - g.cam.cy) * z + h / 2, r.ww * z, r.wh * z); };
      if (!g.tw && g.sharp && g.sharp.z === z && g.sharp.us === (g.us > 0.99)) { c.globalAlpha = da; c.drawImage(g.sharp.cv, 0, 0, w, h); }
      else {
        if (g.us < 0.99) putBitmap(ensureCoarse(sel), da * (1 - g.us));
        if (g.us > 0.01 && g.usRect) putBitmap(ensureUS(), da * g.us);
      }
      if (g.hover && (g.hoverKind === 'country' || g.hoverKind === 'state')) {
        const hp = (g.usMode && g.hover.ins) ? g.hover.ins.tpath : g.hover.path;
        c.save(); c.globalAlpha = da; c.setTransform(d * z, 0, 0, d * z, d * (w / 2 - g.cam.cx * z), d * (h / 2 - g.cam.cy * z));
        c.fillStyle = 'rgba(214,232,255,0.20)'; c.fill(hp);
        c.strokeStyle = 'rgba(235,244,255,0.85)'; c.lineWidth = 1.6 / z; c.lineJoin = 'round'; c.stroke(hp);
        c.restore();
      }
      c.globalAlpha = 1;
    }
  }
  placePins(fz);
}

function updateBadges() {
  g.badges.forEach(b => b.el.classList.toggle('on', g.level === 'country' && !!g.country && g.country.hasStates && !g.tw));
}
function placePins(fz) {
  const z = g.cam.z, w = g.w, h = g.h;
  const vis = g.cont ? ss(0.8, 1, fz) : 0;
  const showBadge = g.level === 'country' && g.country && g.country.hasStates && !g.tw;
  if (showBadge !== g._badgeOn) { g._badgeOn = showBadge; updateBadges(); }
  g.pins.forEach(p => {
    const grp = p.grp;
    let on = vis > 0.05 && grp.cont === g.cont;
    if (on && g.level === 'country') on = grp.country === g.country && !g.country.hasStates;
    if (on && g.level === 'state') on = grp.state === g.state;
    const [gx, gy] = g.usMode ? usPos(grp) : [grp.wx, grp.wy];
    const sx = (gx - g.cam.cx) * z + w / 2, sy = (gy - g.cam.cy) * z + h / 2;
    const live = on && sx > -16 && sx < w + 16 && sy > -16 && sy < h + 16;
    p.el.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`;
    p.el.style.opacity = live ? vis : 0;
    p.el.style.pointerEvents = live && vis > 0.9 ? 'auto' : 'none';
    p.el.tabIndex = live ? 0 : -1;
  });
  g.badges.forEach(b => {
    b.el.style.transform = `translate(${((b.x - g.cam.cx) * z + w / 2).toFixed(1)}px, ${((b.y - g.cam.cy) * z + h / 2).toFixed(1)}px)`;
  });
}

/* the popup that opens when you hover a pin: a small menu of that place's events
   plus a mini marquee of the highlighted event's photos */
let popGroup = null, popPin = null, popTimer = null;

function thumb(p, i) {
  return `<span class="gp-thumb">` +
    (p.src ? `<img src="${esc(p.src)}" alt="" loading="lazy" draggable="false">`
           : `<span class="ph">${pad(i + 1)}</span>`) +
    `</span>`;
}
function miniMarquee(c) {
  const list = c.photos.length ? c.photos.slice(0, 12) : (c.cover ? [{ src: c.cover }] : []);
  if (!list.length) return `<div class="gp-empty">No photos yet</div>`;
  const unit = 126;                                                    // thumbnail + gap
  const reps = Math.max(1, Math.ceil(340 / (list.length * unit)));    // repeat so a short set still fills the width
  let one = '';
  for (let r = 0; r < reps; r++) list.forEach((p, i) => { one += thumb(p, i); });
  const dur = Math.max(8, (list.length * reps * unit) / 32);
  return `<div class="gp-mq"><div class="gp-track" style="animation-duration:${dur}s">` +
           `<div class="gp-group">${one}</div><div class="gp-group" aria-hidden="true">${one}</div>` +
         `</div></div>`;
}
function popBody(c) {
  const n = c.photos.length;
  return miniMarquee(c) +
    `<div class="gp-foot"><span>${n} photo${n === 1 ? '' : 's'}</span>` +
    `<a href="#${esc(c.id)}">View event &rarr;</a></div>`;
}
function popHTML(grp) {
  const rows = grp.events.map((c, i) =>
    `<a class="gp-item${i === 0 ? ' on' : ''}" href="#${esc(c.id)}" data-i="${i}">` +
      `<span>${esc(c.title)}</span><span class="d">${esc(c.date || '')}</span></a>`
  ).join('');
  return `<div class="gp-place">${esc(grp.place)}</div>` +
         `<div class="gp-list">${rows}</div>` +
         `<div class="gp-body">${popBody(grp.events[0])}</div>`;
}
function setPopActive(i) {
  if (!popGroup) return;
  gpop.querySelectorAll('.gp-item').forEach((el, k) => el.classList.toggle('on', k === i));
  gpop.querySelector('.gp-body').innerHTML = popBody(popGroup.events[i]);
}
function positionPop(pinEl) {
  const r = pinEl.getBoundingClientRect();
  const w = gpop.offsetWidth, h = gpop.offsetHeight;
  let left, top;
  if (window.innerWidth < 640) {                                       // phones: centered under (or over) the pin
    left = Math.max(12, (window.innerWidth - w) / 2);
    top = r.bottom + 14;
    if (top + h > window.innerHeight - 12) top = r.top - h - 14;
  } else {
    left = r.right + 14;
    if (left + w > window.innerWidth - 12) left = r.left - w - 14;
    top = r.top + r.height / 2 - 28;
  }
  left = clamp(left, 12, Math.max(12, window.innerWidth - w - 12));
  top = clamp(top, 12, Math.max(12, window.innerHeight - h - 12));
  gpop.style.left = left + 'px';
  gpop.style.top = top + 'px';
}
function openPop(grp, pinEl) {
  clearTimeout(popTimer);
  if (popGroup === grp && !gpop.hidden) return;
  if (popPin) popPin.classList.remove('on');
  popGroup = grp; popPin = pinEl;
  pinEl.classList.add('on');
  gpop.innerHTML = popHTML(grp);
  gpop.querySelectorAll('.gp-item').forEach((el, i) => {
    el.addEventListener('mouseenter', () => setPopActive(i));
    el.addEventListener('focus', () => setPopActive(i));
  });
  gpop.hidden = false;
  positionPop(pinEl);
}
function closePop() {
  clearTimeout(popTimer);
  if (popPin) popPin.classList.remove('on');
  gpop.hidden = true;
  popGroup = null; popPin = null;
}
function schedulePopClose() {
  clearTimeout(popTimer);
  popTimer = setTimeout(closePop, 260);                                // a short grace period to move from pin to popup
}
gpop.addEventListener('mouseenter', () => clearTimeout(popTimer));
gpop.addEventListener('mouseleave', schedulePopClose);
gpop.addEventListener('focusin', () => clearTimeout(popTimer));
gpop.addEventListener('focusout', schedulePopClose);
document.addEventListener('pointerdown', e => {                        // tap or click anywhere else closes it
  if (!gpop.hidden && !gpop.contains(e.target) && !(e.target.closest && e.target.closest('.pin'))) closePop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !gpop.hidden) closePop(); });


function buildPins() {
  gpins.innerHTML = '';
  g.pins = []; g.badges = [];
  groups.forEach(grp => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'pin' + (grp.events.length > 1 ? ' multi' : '');
    el.textContent = grp.events.length > 1 ? String(grp.events.length) : '';
    el.setAttribute('aria-label', `${grp.place}: ${grp.events.length} event${grp.events.length === 1 ? '' : 's'}`);
    el.addEventListener('mouseenter', () => openPop(grp, el));
    el.addEventListener('mouseleave', schedulePopClose);
    el.addEventListener('focus', () => openPop(grp, el));
    el.addEventListener('blur', schedulePopClose);
    el.addEventListener('click', () => openPop(grp, el));
    gpins.appendChild(el);
    g.pins.push({ grp, el });
  });
  g.states.forEach(s => {                       // a count on each US state that has events
    if (!s.events) return;
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'sbadge';
    el.textContent = String(s.events);
    el.setAttribute('aria-label', `${s.name}: ${s.events} event${s.events === 1 ? '' : 's'}. Open`);
    el.addEventListener('click', () => setLevel('state', s));
    const bb = s.ins ? s.ins.tbb : s.bb, bx = (bb.x0 + bb.x1) / 2, by = (bb.y0 + bb.y1) / 2;
    gpins.appendChild(el);
    g.badges.push({ el, s, x: bx, y: by });
  });
}

/* ---- pointer: hover, click, wheel, keys ---- */
const mapPoint = e => { const r = gwrap.getBoundingClientRect(); g.mx = e.clientX - r.left; g.my = e.clientY - r.top; };
gwrap.addEventListener('pointermove', e => {
  mapPoint(e); g.inside = e.pointerType === 'mouse' || !!g.down;
  if (g.down && Math.hypot(e.clientX - g.down.x, e.clientY - g.down.y) > 6) g.down.moved = true;
});
gwrap.addEventListener('pointerleave', () => { g.inside = false; });
gwrap.addEventListener('pointerdown', e => { mapPoint(e); g.down = { x: e.clientX, y: e.clientY, moved: false }; if (e.pointerType !== 'mouse') { g.inside = true; pickHover(performance.now()); } });
gwrap.addEventListener('pointerup', e => {
  const dn = g.down; g.down = null;
  if (!dn || dn.moved || e.target.closest('.pin, .sbadge, .mhud, .lockcard, .minfo')) return;
  mapPoint(e); g.inside = true; pickHover(performance.now());
  mapClick();
});
function mapClick() {
  if (g.tw) return;
  hideLock();
  const h = g.hover;
  if (!h) return;
  if (g.level === 'world') {
    if (h.events) setLevel('cont', h);
    else { g.shake = { ct: h, t0: performance.now() }; showLock(h.name, `No projects in ${h.name} yet.`); }
  } else if (g.level === 'cont') {
    if (h.events) setLevel('country', h);
    else showLock(h.name.replace('United States of America', 'United States'), 'No projects here yet.');
  } else if (g.level === 'country' && g.hoverKind === 'state') {
    if (h.events) setLevel('state', h);
  }
}
gwrap.addEventListener('wheel', e => {
  if (!g.ready) return;
  e.preventDefault();
  const now = performance.now();
  if (now - g.wheelAt < 750 || g.tw) return;
  if (e.deltaY > 12) { g.wheelAt = now; goUp(); }
  else if (e.deltaY < -12 && g.hover) { g.wheelAt = now; g.mx = g.mx; mapClick(); }
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !globeOn() || !gpop.hidden || (typeof lb !== 'undefined' && lb.classList.contains('on'))) return;
  if (g.level !== 'world') goUp();
});
document.addEventListener('pointerdown', e => { if (!lockCard.hidden && !lockCard.contains(e.target)) hideLock(); });

/* ---- load the shapes (from a public CDN) ---- */
function initGlobe() {
  globeInit = true;
  gctx = gcanvas.getContext('2d');
  refreshMapColors();
  const get = url => fetch(url).then(r => { if (!r.ok) throw new Error(url); return r.json(); });
  $('globeHint').textContent = 'Loading the map…';
  Promise.allSettled([get(MAP_DATA.countries), get(MAP_DATA.states)]).then(([c, s]) => {
    if (c.status !== 'fulfilled') { g.failed = true; showGlobeFallback('The map could not load (it needs an internet connection). Here are your events by place:'); return; }
    try {
      buildWorld(c.value, s.status === 'fulfilled' ? s.value : null);
      g.w = 0; sizeGlobe();
      buildPins(); updateHud();
      if (globeOn()) resetGlobe();
    } catch (err) { console.error(err); g.failed = true; showGlobeFallback('The map could not be drawn. Here are your events by place:'); }
  });
}
let gctx = null;
function resetGlobe() {
  if (!g.ready) return;
  g.level = 'world'; g.cont = null; g.country = g.state = null;
  g.usMode = false; g.us = 0;
  g.cam = { cx: g.wcx, cy: WH / 2, z: g.z0 }; g.tw = null; g.sharp = null;
  updateHud(); closePop(); hideLock();
}

/* plain list shown if the map tools could not load, or no event has coords yet */
function showGlobeFallback(message) {
  gwrap.style.display = 'none';
  $('globeHint').style.display = 'none';
  const box = $('globeFallback');
  let h = `<p>${esc(message)}</p>`;
  groups.forEach(grp => {
    h += `<h3>${esc(grp.place)}</h3>` +
         grp.events.map(c => `<a href="#${esc(c.id)}">${esc(c.title)}${c.date ? ' · ' + esc(c.date) : ''}</a>`).join('');
  });
  box.innerHTML = h;
  box.hidden = false;
}

function openGlobe() {
  const n = groups.reduce((sum, grp) => sum + grp.events.length, 0);
  $('globeMeta').textContent = `${n} event${n === 1 ? '' : 's'} · ${groups.length} place${groups.length === 1 ? '' : 's'}`;
  if (!groups.length) {
    showGlobeFallback('No events have a location on the map yet. Add coords: [latitude, longitude] to an event in events.js.');
    return;
  }
  if (!hasD3) {
    showGlobeFallback('The map could not load (it needs an internet connection). Here are your events by place:');
    return;
  }
  if (!globeInit) initGlobe();
  else { sizeGlobe(); resetGlobe(); }
}

/* ---------- one animation loop for the marquee and the globe ---------- */
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (homeOn()) marqueeStep(dt);
  else if (globeOn()) globeStep();
  requestAnimationFrame(frame);
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    measureSidebar();
    if (homeOn()) buildMarquee();
    if (globeOn() && globeInit) { closePop(); sizeGlobe(); }
